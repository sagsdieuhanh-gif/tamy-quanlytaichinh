const compactMoney = n => {const a=Math.abs(number(n)); if(a>=1e9)return `${(number(n)/1e9).toFixed(1).replace('.',',')} tỷ`;if(a>=1e6)return `${(number(n)/1e6).toFixed(1).replace('.',',')} tr`;if(a>=1e3)return `${(number(n)/1e3).toFixed(0)}k`;return money(n);};
const uuid = () => (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : `id${Date.now()}${Math.random().toString(36).slice(2,9)}`;
const localToday = () => {const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const thisMonth = () => localToday().slice(0,7);
const monthLabel = ym => {const [y,m]=ym.split('-').map(Number);return `Tháng ${m}/${y}`;};
const dateLabel = date => {const [y,m,d]=date.split('-').map(Number); return `${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}/${y}`;};
const shiftMonth = (ym, offset) => {const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+offset,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;};
const monthDays = ym => {const [y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate();};
const normalize = text => String(text||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
function createEmpty(){return {version:1,mode:'personal',settings:{name:'Bạn',theme:'light'},wallets:[{id:'cash',name:'Tiền mặt',icon:'wallet',color:'#b8dfbf',opening:0},{id:'bank',name:'Ngân hàng',icon:'bank',color:'#a8c6ed',opening:0}],categories:clone(CATEGORIES),transactions:[],budgets:[]};}
function createDemo(){
 const today=localToday(), curr=thisMonth(), maxDay=Number(today.slice(8));
 const s=createEmpty();s.mode='demo';s.wallets=[{id:'cash',name:'Tiền mặt',icon:'wallet',color:'#b8dfbf',opening:6750000},{id:'bank',name:'Tài khoản ngân hàng',icon:'bank',color:'#b8c9eb',opening:7200000},{id:'saving',name:'Quỹ tiết kiệm',icon:'piggy',color:'#f3d29e',opening:9500000}];
 const add=(ym,day,type,amount,categoryId,note,walletId='bank')=> {if(ym===curr && day>maxDay)return;const [y,m]=ym.split('-').map(Number);const d=Math.min(day,new Date(y,m,0).getDate());s.transactions.push({id:uuid(),type,amount,categoryId,note,walletId,date:`${ym}-${String(d).padStart(2,'0')}`});};
 for(let i=5;i>=0;i--){const mo=shiftMonth(curr,-i),v=1+(5-i)*0.04;
   add(mo,2,'income',Math.round(15000000*v/100000)*100000,'salary','Lương tháng '+Number(mo.slice(5)));
   add(mo,3,'expense',3900000,'housing','Tiền nhà & dịch vụ');
   add(mo,5,'expense',Math.round(315000*v/1000)*1000,'food','Đi chợ cuối tuần','cash');
   add(mo,7,'expense',85000,'entertainment','Cà phê sáng','cash');
   add(mo,9,'expense',220000,'transport','Xăng xe');
   add(mo,12,'expense',Math.round(470000*v/1000)*1000,'shopping','Mua đồ gia dụng');
   add(mo,14,'expense',165000,'food','Bữa trưa cùng bạn','cash');
   add(mo,16,'expense',310000,'health','Chăm sóc sức khỏe');
   add(mo,18,'expense',240000,'education','Mua sách');
   add(mo,20,'expense',295000,'food','Siêu thị thực phẩm','cash');
   add(mo,22,'expense',110000,'transport','Gửi xe và di chuyển','cash');
   add(mo,26,'expense',210000,'entertainment','Cuối tuần thư giãn');
   if(i%2===0)add(mo,20,'income',1350000,'bonus','Thưởng dự án');
 }
 s.budgets=[{id:uuid(),month:curr,categoryId:'food',limit:2500000},{id:uuid(),month:curr,categoryId:'shopping',limit:1600000},{id:uuid(),month:curr,categoryId:'transport',limit:900000},{id:uuid(),month:curr,categoryId:'entertainment',limit:1000000}];
 s.transactions.sort((a,b)=>b.date.localeCompare(a.date));
 return s;
}
function readState(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const val=JSON.parse(raw);if(validateState(val))return val;}}catch(err){console.warn('Không thể đọc dữ liệu:',err);}return createDemo();}
function validateState(v){return !!(v && v.version===1 && Array.isArray(v.wallets) && Array.isArray(v.categories) && Array.isArray(v.transactions) && Array.isArray(v.budgets) && v.settings && v.wallets.length>0);}
let state=readState();
const ui={view:'overview',month:thisMonth(),filter:'all',search:'',category:'all',modal:null,draft:null};
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));return true;}catch(err){toast('Không thể lưu dữ liệu. Kiểm tra bộ nhớ trình duyệt.','alert');return false;}}
function category(id){return state.categories.find(c=>c.id===id)||{id,name:'Khác',icon:'gift',color:'#c7d4d0',type:'expense'};}
function wallet(id){return state.wallets.find(w=>w.id===id)||{id,name:'Ví đã xóa',icon:'wallet',color:'#bed2c1',opening:0};}
function walletBalance(id){let total=number(wallet(id).opening);for(const t of state.transactions){if(t.type==='income'&&t.walletId===id)total+=number(t.amount);else if(t.type==='expense'&&t.walletId===id)total-=number(t.amount);else if(t.type==='transfer'){if(t.fromWalletId===id)total-=number(t.amount);if(t.toWalletId===id)total+=number(t.amount);}}return total;}
function totalBalance(){return state.wallets.reduce((n,w)=>n+walletBalance(w.id),0);}
function transactionsForMonth(ym=ui.month){return state.transactions.filter(t=>t.date&&t.date.slice(0,7)===ym).sort((a,b)=>b.date.localeCompare(a.date));}
function totals(ym=ui.month){const ts=transactionsForMonth(ym);return {income:ts.filter(t=>t.type==='income').reduce((a,t)=>a+number(t.amount),0),expense:ts.filter(t=>t.type==='expense').reduce((a,t)=>a+number(t.amount),0)};}
function categorySpends(ym=ui.month){const spent={};for(const tx of transactionsForMonth(ym)){if(tx.type==='expense')spent[tx.categoryId]=(spent[tx.categoryId]||0)+number(tx.amount);}return Object.entries(spent).sort((a,b)=>b[1]-a[1]).map(([id,value])=>({cat:category(id),value}));}
function budgetSpent(b){return transactionsForMonth(b.month).filter(t=>t.type==='expense'&&t.categoryId===b.categoryId).reduce((n,t)=>n+number(t.amount),0);}
function toast(message,ico='check'){const root=document.getElementById('toast-root');if(!root)return;root.innerHTML=`<div class="toast">${icons(ico,'icon-sm')} ${escapeHtml(message)}</div>`;window.clearTimeout(toast.timer);toast.timer=window.setTimeout(()=>{root.innerHTML='';},3300);}
function setTheme(theme){document.documentElement.dataset.theme=theme==='dark'?'dark':'light';const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=theme==='dark'?'#101d19':'#f7f8f4';}
setTheme(state.settings.theme);
function navButton([key,label,ico],mobile=false){return `<button class="${mobile?'bottom-link':'nav-link'} ${ui.view===key?'active':''}" data-action="nav" data-view="${key}" title="${escapeHtml(label)}" aria-label="${escapeHtml(label)}" aria-current="${ui.view===key?'page':'false'}">${icons(ico)}<span>${label}</span>${mobile?'':icons('chev-right','nav-chevron icon-xs')}</button>`;}
function renderShell(){
 const [heading,subheading]={overview:['Xin chào, '+(state.settings.name||'Bạn')+' 👋','Hôm nay, mình cùng quản lý tiền thật nhẹ nhàng nhé.'],transactions:['Giao dịch','Mỗi khoản nhỏ đều đáng được ghi nhớ.'],budgets:['Ngân sách','Đặt giới hạn để ưu tiên điều quan trọng.'],wallets:['Ví & tài khoản','Mọi nguồn tiền đều trong tầm mắt.'],reports:['Báo cáo tài chính','Nhìn lại thói quen để chi tiêu thông minh.'],settings:['Cài đặt','Cá nhân hóa không gian tài chính của bạn.']}[ui.view];
 document.getElementById('app').innerHTML=`

  <div class="main-content" id="page-content">${renderPage()}</div></main>
  <nav class="bottom-nav" aria-label="Điều hướng điện thoại">${NAV.slice(0,2).map(n=>navButton(n,true)).join('')}<button class="fab-space" tabindex="-1" aria-hidden="true"></button>${NAV.slice(2,5).map(n=>navButton(n,true)).join('')}</nav><button class="fab" data-action="add-transaction" aria-label="Thêm giao dịch">${icons('plus','icon-lg')}</button>`;
 renderModal();

function renderOverview(){const t=totals(),bal=totalBalance(),currBudgets=state.budgets.filter(b=>b.month===ui.month),latest=transactionsForMonth(ui.month).slice(0,5);
 return `${renderIntro()}<section class="hero"><div class="hero-content"><div class="hero-top"><div class="hero-label">Tổng số dư hiện tại</div><span class="hero-badge">${icons('shield','icon-xs')} Lưu ngay trên thiết bị</span></div><div class="hero-balance mono-num">${money(bal)} <small>đ</small></div><div class="hero-bottom"><div class="hero-stat"><span class="hero-stat-icon">${icons('arrow-down-left','icon-sm')}</span><div><div class="label">Thu nhập tháng</div><b class="mono-num">+${fullMoney(t.income)}</b></div></div><div class="hero-divide"></div><div class="hero-stat"><span class="hero-stat-icon">${icons('arrow-up-right','icon-sm')}</span><div><div class="label">Chi tiêu tháng</div><b class="mono-num">−${fullMoney(t.expense)}</b></div></div></div></div><svg class="hero-wave" viewBox="0 0 170 110"><path fill="none" stroke="white" stroke-width="5" d="M2 100C30 70 52 85 80 54S135 60 172 1"/></svg></section>
 <div class="space-top quick-actions"><button class="quick-action" data-action="quick-expense"><span class="qa-icon" style="background:#fff0e6;color:#d78050">${icons('arrow-up-right')}</span><span><b>Ghi khoản chi</b><small>Chỉ vài giây</small></span></button><button class="quick-action" data-action="quick-income"><span class="qa-icon" style="background:#e4f3e7;color:#408967">${icons('arrow-down-left')}</span><span><b>Thêm thu nhập</b><small>Ghi tiền vào</small></span></button><button class="quick-action" data-action="quick-transfer"><span class="qa-icon" style="background:#edeafd;color:#9075c8">${icons('swap')}</span><span><b>Chuyển ví</b><small>Điều chuyển tiền</small></span></button></div>
 <div class="grid grid-2 space-top"><section class="card"><div class="section-head"><div><h2>Dòng tiền của bạn</h2><p>Chi tiêu lũy kế trong ${monthLabel(ui.month).toLowerCase()}</p></div><span class="overline">${monthLabel(ui.month)}</span></div>${lineChart(ui.month)}<div class="chart-note"><span>${icons('info','icon-xs')} Đồ thị thể hiện tổng chi tiêu tích lũy từng ngày</span><span class="chart-legend"><i class="legend-dot"></i> Chi tiêu</span></div></section><section class="card"><div class="section-head"><div><h2>Chi tiêu theo danh mục</h2><p>Tiền của bạn đang đi đâu?</p></div>${icons('chart-pie')}</div>${renderDonut(ui.month)}</section></div>

function emptyBlock(ico,heading,desc,action,label){return `<div class="empty-state"><div class="empty-icon">${icons(ico,'icon-lg')}</div><b>${escapeHtml(heading)}</b><p>${escapeHtml(desc)}</p>${action?`<button class="btn btn-soft btn-small" data-action="${action}">${icons('plus','icon-sm')} ${escapeHtml(label||'Thêm mới')}</button>`:''}</div>`;}
function lineChart(ym){const days=monthDays(ym),ts=transactionsForMonth(ym),nums=Array.from({length:days},()=>0);ts.filter(t=>t.type==='expense').forEach(t=>{const day=Number(t.date.slice(8));if(day>0 && day<=days)nums[day-1]+=number(t.amount);});let v=0;const cum=nums.map(n=>(v+=n));const ymax=Math.max(1000000,...cum)*1.12;const W=640,H=213,L=50,R=15,T=12,B=28,plotW=W-L-R,plotH=H-T-B;const x=i=>L+i*plotW/Math.max(1,days-1),y=n=>T+plotH-n/ymax*plotH;const pts=cum.map((val,i)=>[x(i),y(val)]);const line=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');const area=`${line} L${x(days-1)} ${T+plotH} L${L} ${T+plotH} Z`;const ticks=[0,.25,.5,.75,1].map(fr=>{let yy=T+plotH*(1-fr);return `<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" class="chart-grid-line"/><text class="chart-grid-label" x="${L-9}" y="${yy+3}" text-anchor="end">${compactMoney(ymax*fr)}</text>`;}).join('');const dates=[1,Math.round(days*.25),Math.round(days*.5),Math.round(days*.75),days].map(d=>`<text class="chart-grid-label" x="${x(d-1)}" y="${H-5}" text-anchor="middle">${d}/${Number(ym.slice(5))}</text>`).join('');return `<div class="chart-wrap"><svg class="line-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ chi tiêu lũy kế tháng ${escapeHtml(ym)}"><defs><linearGradient id="areaGradient" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#4aad87" stop-opacity=".20"/><stop offset="1" stop-color="#4aad87" stop-opacity=".005"/></linearGradient></defs>${ticks}${dates}<path d="${area}" class="chart-area"/><path d="${line}" class="chart-line"/>${cum.length?`<circle class="chart-dot" cx="${x(days-1)}" cy="${y(cum[days-1])}" r="5"><title>${fullMoney(cum[days-1])}</title></circle>`:''}</svg></div>`;}
function renderDonut(ym){const list=categorySpends(ym),total=list.reduce((a,it)=>a+it.value,0);if(!total)return emptyBlock('chart-pie','Chưa có chi tiêu','Khi có giao dịch chi tiêu, biểu đồ sẽ xuất hiện.');let last=0;const arcs=list.map(it=>{const next=last+it.value/total*100;const chunk=`${it.cat.color} ${last.toFixed(2)}% ${next.toFixed(2)}%`;last=next;return chunk;});return `<div class="donut-layout"><div class="donut" style="background:conic-gradient(${arcs.join(',')})" role="img" aria-label="Chi tiêu phân theo danh mục"><div class="donut-hole"><small>Tổng chi</small><b class="mono-num">${compactMoney(total)}</b></div></div><div class="donut-legend">${list.slice(0,5).map(it=>`<div class="legend-row"><div class="legend-name"><i class="color-dot" style="background:${it.cat.color}"></i>${escapeHtml(it.cat.name)}</div><b>${Math.round(it.value/total*100)}%</b></div>`).join('')}</div></div>`;}
function renderTxItem(t){const kind=t.type,cat=kind==='transfer'?{name:'Chuyển giữa các ví',color:'#c9d7e1',icon:'swap'}:category(t.categoryId),title=t.note || (kind==='transfer'? 'Chuyển tiền':cat.name);const w=kind==='transfer'?`${wallet(t.fromWalletId).name} → ${wallet(t.toWalletId).name}`:wallet(t.walletId).name;const amountText=kind==='income'?`+${fullMoney(t.amount)}`:kind==='expense'?`−${fullMoney(t.amount)}`:fullMoney(t.amount);return `<button class="tx-item" data-action="edit-transaction" data-id="${escapeHtml(t.id)}" aria-label="Sửa giao dịch ${escapeHtml(title)}"><div class="tx-icon" style="background:${cat.color}38;color:${cat.color}">${icons(cat.icon)}</div><div class="tx-content"><div class="tx-title">${escapeHtml(title)}</div><div class="tx-desc">${escapeHtml(cat.name)} · ${escapeHtml(w)} · ${dateLabel(t.date)}</div></div><div class="tx-value mono-num ${kind==='income'?'income':kind==='expense'?'bad':''}">${amountText}</div></button>`;}
function renderBudgetRow(b){const cat=category(b.categoryId),spent=budgetSpent(b),percent=b.limit>0?Math.round(spent/b.limit*100):0,over=spent>b.limit,color=over?'#e67d72':'#4da882';return `<div class="budget-row"><div class="budget-head"><span class="budget-icon" style="background:${cat.color}35;color:${cat.color}">${icons(cat.icon)}</span><div class="budget-text"><b>${escapeHtml(cat.name)}</b><small>Đã dùng ${fullMoney(spent)}</small></div><b class="percent ${over?'bad':''}">${percent}%</b></div><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,Math.max(0,percent))}%;background:${color}"></div></div><div class="budget-bottom"><span>${over?'Vượt ngân sách '+fullMoney(spent-b.limit):'Còn '+fullMoney(Math.max(0,b.limit-spent))}</span><b>Giới hạn ${fullMoney(b.limit)}</b></div></div>`;}
function renderTransactions(){const t=totals();return `${renderIntro()}<div class="grid grid-3 space-bottom"><div class="stat-tile"><div class="icon-top">${icons('arrow-down-left')}</div><p class="stat-label">Thu nhập trong tháng</p><div class="stat-amount good mono-num">+${fullMoney(t.income)}</div><p class="stat-foot">${monthLabel(ui.month)}</p></div><div class="stat-tile"><div class="icon-top" style="color:var(--red)">${icons('arrow-up-right')}</div><p class="stat-label">Chi tiêu trong tháng</p><div class="stat-amount mono-num">${fullMoney(t.expense)}</div><p class="stat-foot">${monthLabel(ui.month)}</p></div><div class="stat-tile"><div class="icon-top">${icons('wallet')}</div><p class="stat-label">Chênh lệch thu − chi</p><div class="stat-amount mono-num ${t.income-t.expense<0?'bad':'good'}">${fullMoney(t.income-t.expense)}</div><p class="stat-foot">Không tính chuyển ví</p></div></div>
 <section class="card"><div class="section-head"><div><h2>Lịch sử giao dịch</h2><p>Tìm nhanh và chỉnh sửa bất kỳ khoản thu chi nào</p></div><button class="btn btn-primary btn-small" data-action="add-transaction">${icons('plus','icon-sm')} <span>Thêm mới</span></button></div><div class="filter-row"><label class="searchbar">${icons('search','icon-sm')}<input type="search" id="tx-search" placeholder="Tìm mô tả, danh mục hoặc ví..." value="${escapeHtml(ui.search)}" aria-label="Tìm giao dịch" /></label><div class="segment" role="group" aria-label="Loại giao dịch">${[['all','Tất cả'],['expense','Khoản chi'],['income','Khoản thu'],['transfer','Chuyển ví']].map(([key,label])=>`<button class="${ui.filter===key?'selected':''}" data-action="filter" data-filter="${key}">${label}</button>`).join('')}</div></div><div id="transaction-results">${renderTransactionResults()}</div></section>`;}

tạo ví Tiền mặt, Ngân hàng hay Tiết kiệm. Mỗi giao dịch sẽ cộng hoặc trừ đúng ví được chọn. Chuyển ví không được tính là thu nhập hay chi tiêu.</p></div></div></div>`;}

 <div class="grid grid-2 space-top"><section class="card"><div class="section-head"><div><h2>Chi tiêu theo danh mục</h2><p>Xếp hạng các khoản chi trong tháng</p></div></div>${spends.length?`<div class="report-list">${spends.map((it,i)=>`<div class="legend-row"><div class="legend-name"><span class="muted" style="font-size:10px;min-width:17px">${String(i+1).padStart(2,'0')}</span><span class="budget-icon" style="background:${it.cat.color}38;color:${it.cat.color};height:35px;width:35px">${icons(it.cat.icon,'icon-sm')}</span><span>${escapeHtml(it.cat.name)} <small class="muted">· ${Math.round(it.value/Math.max(total,1)*100)}%</small></span></div><b>${fullMoney(it.value)}</b></div>`).join('')}</div>`:emptyBlock('chart-pie','Chưa có dữ liệu','Thêm giao dịch chi tiêu để xem thống kê.')}</section><section class="card"><div class="section-head"><div><h2>Chi tiêu theo thời gian</h2><p>Lũy kế trong ${monthLabel(ui.month).toLowerCase()}</p></div></div>${lineChart(ui.month)}<div class="chart-note"><span>Tính tổng đến từng ngày trong tháng</span></div></section></div><div class="space-top" style="display:flex;justify-content:flex-end"><button class="btn btn-outline" data-action="export-csv">${icons('download','icon-sm')} Xuất giao dịch CSV</button></div>`;}
function renderSettings(){return `${renderIntro()}<div class="grid grid-2"><div><section class="card"><div class="section-head"><div><h2>Cá nhân hóa</h2><p>Không gian quản lý tiền của riêng bạn</p></div></div><div class="settings-row"><div class="settings-row-content"><span class="settings-icon">${icons('hand')}</span><div><strong>Tên hiển thị</strong><p>Cách Mộc chào bạn trên trang tổng quan</p></div></div><button class="btn btn-outline btn-small" data-action="edit-name">${escapeHtml(state.settings.name||'Bạn')} ${icons('edit','icon-xs')}</button></div><div class="settings-row"><div class="settings-row-content"><span class="settings-icon">${icons('sun')}</span><div><strong>Chủ đề giao diện</strong><p>Chọn màu sáng hay tối tùy thói quen</p></div></div><select id="theme-select" class="setting-select" aria-label="Chủ đề"><option value="light" ${state.settings.theme!=='dark'?'selected':''}>☀️ Sáng</option><option value="dark" ${state.settings.theme==='dark'?'selected':''}>🌙 Tối</option></select></div><div class="settings-row"><div class="settings-row-content"><span class="settings-icon">${icons('shield')}</span><div><strong>Lưu dữ liệu riêng tư</strong><p>Giao dịch lưu ngay trên thiết bị này bằng localStorage. Chưa có đồng bộ đám mây.</p></div></div><span style="font-size:10px;color:var(--green-2);font-weight:800">Cục bộ</span></div></section>
 <section class="card space-top"><div class="section-head"><div><h2>Danh mục tùy chỉnh</h2><p>Thêm danh mục phù hợp cuộc sống của bạn</p></div><button class="btn btn-outline btn-small" data-action="add-category">${icons('plus','icon-sm')} Thêm</button></div><div class="overline" style="margin:13px 0 9px">CHI TIÊU</div><div class="chip-list">${state.categories.filter(c=>c.type==='expense').map(catChip).join('')}</div><div class="overline" style="margin:20px 0 9px">THU NHẬP</div><div class="chip-list">${state.categories.filter(c=>c.type==='income').map(catChip).join('')}</div></section></div>

function catChip(c){const deletable=!CATEGORIES.some(d=>d.id===c.id) && !state.transactions.some(t=>t.categoryId===c.id)&&!state.budgets.some(b=>b.categoryId===c.id);return `<span class="category-chip"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${c.color}"></span>${escapeHtml(c.name)}${deletable?`<button data-action="delete-category" data-id="${escapeHtml(c.id)}" aria-label="Xóa ${escapeHtml(c.name)}">${icons('close','icon-xs')}</button>`:''}</span>`;}
function openModal(kind,id=null,preset={}){
 let draft={};
 if(kind==='transaction'){
  const existing=id?state.transactions.find(t=>t.id===id):null;
  draft=existing?clone(existing):{type:preset.type||'expense',amount:'',date:localToday(),categoryId:preset.type==='income'?'salary':'food',walletId:state.wallets[0]?.id,fromWalletId:state.wallets[0]?.id,toWalletId:state.wallets[1]?.id||state.wallets[0]?.id,note:''};
 }else if(kind==='wallet'){
  draft=id?clone(state.wallets.find(w=>w.id===id)||{}):{name:'',opening:'',icon:'wallet',color:COLORS[0]};
 }else if(kind==='budget'){
  draft=id?clone(state.budgets.find(b=>b.id===id)||{}):{categoryId:preset.categoryId||'food',limit:'',month:ui.month};
 }else if(kind==='category'){
  draft={name:'',type:'expense',icon:'gift',color:COLORS[0]};
 }else if(kind==='name'){
  draft={name:state.settings.name||'Bạn'};
 }else if(kind==='confirm'){
  draft=preset;
 }
 ui.modal={kind,id};ui.draft=draft;renderModal();
 const focusId={transaction:'amount-field',wallet:'wallet-name',budget:'budget-amount',category:'category-name',name:'display-name'}[kind];
 if(focusId)window.setTimeout(()=>{const el=document.getElementById(focusId);if(el && window.innerWidth>700)el.focus();},60);
}

 return `${modalHeading(edit?'Chỉnh sửa giao dịch':'Thêm giao dịch','Ghi lại dòng tiền chỉ trong vài thao tác')}<form class="modal-content" id="transaction-form"><div class="type-switch"><button type="button" class="${type==='expense'?'active':''}" data-action="set-transaction-type" data-type="expense">↗ Chi tiêu</button><button type="button" class="${type==='income'?'active':''}" data-action="set-transaction-type" data-type="income">↙ Thu nhập</button><button type="button" class="${transfer?'active':''}" data-action="set-transaction-type" data-type="transfer">⇄ Chuyển ví</button></div><div class="amount-field"><div class="amount-label">${type==='expense'?'Số tiền đã chi':type==='income'?'Số tiền nhận được':'Số tiền chuyển'}</div><div class="amount-input-wrap"><input id="amount-field" class="amount-input mono-num" aria-label="Số tiền" name="amount" data-field="amount" inputmode="numeric" type="text" pattern="[0-9., ]*" autocomplete="off" placeholder="0" value="${d.amount?money(d.amount):''}" required/><span>đ</span></div></div>
 ${picker}${transfer?`<div class="form-row"><div class="form-field"><label for="from-wallet" class="form-label">Từ ví</label><select id="from-wallet" name="fromWalletId" data-field="fromWalletId" class="form-control">${walletOptions(d.fromWalletId)}</select></div><div class="form-field"><label for="to-wallet" class="form-label">Đến ví</label><select id="to-wallet" name="toWalletId" data-field="toWalletId" class="form-control">${walletOptions(d.toWalletId)}</select></div></div>`:`<div class="form-field"><label for="tx-wallet" class="form-label">Ghi nhận vào ví</label><select id="tx-wallet" name="walletId" data-field="walletId" class="form-control">${walletOptions(d.walletId)}</select></div>`}
 <div class="form-row"><div class="form-field"><label for="tx-date" class="form-label">Ngày giao dịch</label><input id="tx-date" name="date" data-field="date" class="form-control" type="date" value="${escapeHtml(d.date)}" required /></div><div class="form-field"><label for="tx-note" class="form-label">Ghi chú</label><input id="tx-note" name="note" data-field="note" class="form-control" maxlength="120" placeholder="Ví dụ: Ăn trưa" value="${escapeHtml(d.note)}" /></div></div>${modalFormFooter(edit,edit?'Lưu thay đổi':'Lưu giao dịch')}</form>`;
}
function renderWalletModal(){const d=ui.draft,edit=!!ui.modal.id;return `${modalHeading(edit?'Chỉnh sửa ví':'Tạo ví mới','Theo dõi tiền ở từng nơi riêng biệt')}<form id="wallet-form" class="modal-content"><div class="form-field"><label for="wallet-name" class="form-label">Tên ví</label><input id="wallet-name" class="form-control" name="name" data-field="name" maxlength="45" required placeholder="Ví dụ: Ngân hàng ACB" value="${escapeHtml(d.name)}"/></div><div class="form-field"><label for="wallet-opening" class="form-label">Số dư ban đầu (đ)</label><input id="wallet-opening" class="form-control mono-num" name="opening" data-field="opening" inputmode="numeric" autocomplete="off" placeholder="0" value="${d.opening!==''?money(d.opening):''}"/></div><div class="form-field"><label class="form-label" for="wallet-icon">Biểu tượng</label><select id="wallet-icon" class="form-control" data-field="icon" name="icon">${[['wallet','Ví tiền'],['bank','Ngân hàng'],['piggy','Tiết kiệm'],['gift','Quỹ riêng']].map(([v,l])=>`<option value="${v}" ${d.icon===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="form-field"><label class="form-label">Màu ví</label>${renderColorPicker(d.color)}</div>${modalFormFooter(edit,edit?'Lưu thay đổi':'Tạo ví')}</form>`;}
function renderBudgetModal(){const d=ui.draft,edit=!!ui.modal.id;return `${modalHeading(edit?'Chỉnh sửa ngân sách':'Tạo ngân sách',`Lập kế hoạch cho ${monthLabel(d.month||ui.month).toLowerCase()}`)}<form id="budget-form" class="modal-content"><div class="form-field"><label for="budget-category" class="form-label">Danh mục chi tiêu</label><select class="form-control" id="budget-category" name="categoryId" data-field="categoryId">${state.categories.filter(c=>c.type==='expense').map(c=>`<option value="${escapeHtml(c.id)}" ${d.categoryId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select></div><div class="form-field"><label for="budget-amount" class="form-label">Giới hạn mỗi tháng (đ)</label><input id="budget-amount" class="form-control mono-num" name="limit" data-field="limit" inputmode="numeric" autocomplete="off" placeholder="Ví dụ: 2.000.000" value="${d.limit?money(d.limit):''}" required/></div><p class="modal-note">Nếu đã có ngân sách cho danh mục này trong tháng, Mộc sẽ cập nhật hạn mức đang có.</p>${modalFormFooter(edit,edit?'Cập nhật':'Lưu ngân sách')}</form>`;}
function renderCategoryModal(){const d=ui.draft;return `${modalHeading('Thêm danh mục','Phân loại các khoản thu chi theo nhu cầu')}<form id="category-form" class="modal-content"><div class="form-field"><label for="category-name" class="form-label">Tên danh mục</label><input class="form-control" id="category-name" name="name" data-field="name" maxlength="30" placeholder="Ví dụ: Du lịch" required value="${escapeHtml(d.name)}"/></div><div class="form-row"><div class="form-field"><label for="category-type" class="form-label">Loại</label><select class="form-control" id="category-type" name="type" data-field="type"><option value="expense">Chi tiêu</option><option value="income">Thu nhập</option></select></div><div class="form-field"><label for="category-icon" class="form-label">Biểu tượng</label><select class="form-control" id="category-icon" name="icon" data-field="icon">${[['gift','Món quà'],['food','Ăn uống'],['shopping','Mua sắm'],['car','Di chuyển'],['house','Nhà cửa'],['heart','Sức khỏe'],['book','Học tập'],['coffee','Cà phê'],['briefcase','Công việc'],['star','Ngôi sao'],['piggy','Tiết kiệm']].map(([v,l])=>`<option value="${v}" ${d.icon===v?'selected':''}>${l}</option>`).join('')}</select></div></div><div class="form-field"><label class="form-label">Chọn màu hiển thị</label>${renderColorPicker(d.color)}</div>${modalFormFooter(false,'Thêm danh mục')}</form>`;}
function renderColorPicker(current){return `<div class="color-picker">${COLORS.map(c=>`<button type="button" class="color-choice ${current===c?'active':''}" data-action="choose-color" data-color="${c}" style="background:${c}" aria-label="Chọn màu ${c}" aria-pressed="${current===c}"></button>`).join('')}</div>`;}
function renderNameModal(){return `${modalHeading('Tên hiển thị','Hãy để Mộc gọi bạn theo cách bạn thích')}<form id="name-form" class="modal-content"><div class="form-field"><label class="form-label" for="display-name">Tên của bạn</label><input id="display-name" class="form-control" name="name" maxlength="35" required value="${escapeHtml(ui.draft.name)}"/></div>${modalFormFooter(false,'Lưu tên')}</form>`;}
function renderConfirmModal(){const d=ui.draft;return `${modalHeading(d.title||'Xác nhận') }<div class="modal-content"><p class="confirm-text">${escapeHtml(d.message||'Bạn có chắc chắn không?')}</p>${d.warning?`<div class="confirm-warning">${icons('alert','icon-sm')} ${escapeHtml(d.warning)}</div>`:''}<div class="form-footer"><button type="button" class="btn btn-outline" data-action="close-modal">Hủy</button><button type="button" class="btn ${d.danger?'btn-danger':'btn-primary'}" data-action="confirm-apply">${icons('check','icon-sm')} ${escapeHtml(d.accept||'Xác nhận')}</button></div></div>`;}
function renderModal(){const root=document.getElementById('modal-root');if(!root)return;if(!ui.modal){root.innerHTML='';document.body.style.overflow='';return;}let inner='';switch(ui.modal.kind){case'transaction':inner=renderTransactionModal();break;case'wallet':inner=renderWalletModal();break;case'budget':inner=renderBudgetModal();break;case'category':inner=renderCategoryModal();break;case'name':inner=renderNameModal();break;case'confirm':inner=renderConfirmModal();break;}root.innerHTML=`<div class="modal-overlay" id="modal-overlay"><div class="modal-dialog" role="dialog" aria-modal="true" aria-label="${escapeHtml(ui.modal.kind)}">${inner}</div></div>`;document.body.style.overflow='hidden';}
function showError(msg){const node=document.getElementById('form-error');if(node)node.textContent=msg;else toast(msg,'alert');}
function parseAmount(str){const digits=String(str??'').replace(/[^0-9]/g,'');return digits?Number(digits):0;}
function validAmount(n,allowZero=false){return Number.isSafeInteger(n) && n>=0 && n<=1e12 && (allowZero || n>0);}
function commitTransaction(form){const d=ui.draft,amount=parseAmount(form.elements.amount.value),date=form.elements.date.value,note=String(form.elements.note.value||'').trim().slice(0,120);if(!validAmount(amount))return showError('Vui lòng nhập số tiền hợp lệ, lớn hơn 0.');if(!/^\d{4}-\d{2}-\d{2}$/.test(date) || Number.isNaN(new Date(date+'T12:00:00').getTime()))return showError('Vui lòng chọn ngày hợp lệ.');if(d.type==='transfer'&&state.wallets.length<2)return showError('Cần ít nhất 2 ví để chuyển tiền.');let entry={id:ui.modal.id||uuid(),type:d.type,amount,date,note};if(d.type==='transfer'){
  entry.fromWalletId=form.elements.fromWalletId.value;entry.toWalletId=form.elements.toWalletId.value;
  if(entry.fromWalletId===entry.toWalletId)return showError('Ví nguồn và ví đích phải khác nhau.');
 }else{
  entry.walletId=form.elements.walletId.value;entry.categoryId=d.categoryId;
  if(!state.categories.some(c=>c.id===entry.categoryId&&c.type===d.type))return showError('Vui lòng chọn một danh mục.');
 }
 if(ui.modal.id){const idx=state.transactions.findIndex(t=>t.id===ui.modal.id);if(idx<0)return showError('Không tìm thấy giao dịch.');state.transactions[idx]=entry;}else state.transactions.unshift(entry);
 save();closeModal();renderShell();toast(ui.modal?'Đã lưu thay đổi':'Đã lưu giao dịch thành công');
}
function commitWallet(form){const name=String(form.elements.name.value||'').trim().slice(0,45),opening=parseAmount(form.elements.opening.value),iconName=form.elements.icon.value,color=ui.draft.color;if(!name)return showError('Vui lòng nhập tên ví.');if(!validAmount(opening,true))return showError('Số dư ban đầu phải từ 0 đến 1.000 tỷ đồng.');const obj={id:ui.modal.id||uuid(),name,opening,icon:ICONS[iconName]?iconName:'wallet',color:COLORS.includes(color)?color:COLORS[0]};if(ui.modal.id){const idx=state.wallets.findIndex(w=>w.id===ui.modal.id);if(idx<0)return showError('Không tìm thấy ví.');state.wallets[idx]=obj;}else state.wallets.push(obj);save();closeModal();renderShell();toast('Đã lưu thông tin ví');}
function commitBudget(form){const categoryId=form.elements.categoryId.value,limit=parseAmount(form.elements.limit.value),month=ui.draft.month||ui.month;if(!validAmount(limit))return showError('Nhập giới hạn lớn hơn 0 và không vượt quá 1.000 tỷ.');if(!state.categories.some(c=>c.id===categoryId&&c.type==='expense'))return showError('Danh mục không hợp lệ.');const old=state.budgets.find(b=>b.month===month&&b.categoryId===categoryId),id=ui.modal.id||old?.id||uuid();const obj={id,categoryId,limit,month};if(ui.modal.id){const idx=state.budgets.findIndex(b=>b.id===ui.modal.id);if(idx<0)return showError('Không tìm thấy ngân sách.');if(old&&old.id!==id)return showError('Danh mục này đã có ngân sách.');state.budgets[idx]=obj;}else if(old){Object.assign(old,obj);}else state.budgets.push(obj);save();closeModal();renderShell();toast('Đã lưu ngân sách');}
function commitCategory(form){const name=String(form.elements.name.value||'').trim().slice(0,30),type=form.elements.type.value,iconName=form.elements.icon.value;if(!name)return showError('Hãy nhập tên danh mục.');if(!['income','expense'].includes(type))return showError('Loại danh mục không hợp lệ.');if(state.categories.some(c=>c.type===type&&normalize(c.name)===normalize(name)))return showError('Danh mục này đã tồn tại.');state.categories.push({id:uuid(),name,type,icon:ICONS[iconName]?iconName:'gift',color:COLORS.includes(ui.draft.color)?ui.draft.color:COLORS[0]});save();closeModal();renderShell();toast('Đã thêm danh mục mới');}
function confirm(title,message,action,opts={}){openModal('confirm',null,{title,message,action,...opts});}
function deleteCurrent(){const kind=ui.modal?.kind,id=ui.modal?.id;if(!id)return;
 if(kind==='transaction')confirm('Xóa giao dịch?','Giao dịch này sẽ bị xóa khỏi tất cả báo cáo và số dư ví.','delete-transaction',{id,danger:true,warning:'Thao tác này không thể hoàn tác.',accept:'Xóa giao dịch'});
 if(kind==='wallet'){
  if(state.wallets.length<=1){toast('Cần giữ lại ít nhất một ví.','alert');return;}
  if(state.transactions.some(t=>t.walletId===id||t.fromWalletId===id||t.toWalletId===id)){toast('Ví đang có giao dịch. Hãy giữ ví để không mất lịch sử.','alert');return;}
  confirm('Xóa ví này?','Ví chưa phát sinh giao dịch sẽ được xóa khỏi danh sách.','delete-wallet',{id,danger:true,accept:'Xóa ví'});
 }
 if(kind==='budget')confirm('Xóa ngân sách?','Giới hạn của danh mục này sẽ bị gỡ bỏ. Các giao dịch vẫn được giữ nguyên.','delete-budget',{id,danger:true,accept:'Xóa ngân sách'});
}
function applyConfirm(){const d=ui.draft;if(!d)return;switch(d.action){
 case'delete-transaction':state.transactions=state.transactions.filter(t=>t.id!==d.id);break;
 case'delete-wallet':state.wallets=state.wallets.filter(w=>w.id!==d.id);break;
 case'delete-budget':state.budgets=state.budgets.filter(b=>b.id!==d.id);break;
 case'delete-category':state.categories=state.categories.filter(c=>c.id!==d.id);break;
 case'clear-data':case'start-fresh':state=createEmpty();break;
 case'reset-demo':state=createDemo();break;
 case'import':if(pendingImport)state=pendingImport;pendingImport=null;break;
 default:return;
 }
 save();closeModal();ui.search='';ui.filter='all';ui.month=thisMonth();renderShell();toast('Đã cập nhật dữ liệu');
}
function downloadFile(name,mime,contents){const blob=new Blob([contents],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();window.setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportJSON(){downloadFile(`moc-finance-backup-${localToday()}.json`,'application/json;charset=utf-8',JSON.stringify(state,null,2));toast('Đã tạo tệp sao lưu JSON','download');}
function exportCSV(){const rows=[['Ngày','Loại','Số tiền (VND)','Danh mục','Ví','Ví đích','Ghi chú']];for(const t of [...state.transactions].sort((a,b)=>b.date.localeCompare(a.date))){rows.push([t.date,t.type==='expense'?'Chi tiêu':t.type==='income'?'Thu nhập':'Chuyển ví',t.amount,t.type==='transfer'?'Chuyển ví':category(t.categoryId).name,t.type==='transfer'?wallet(t.fromWalletId).name:wallet(t.walletId).name,t.type==='transfer'?wallet(t.toWalletId).name:'',t.note||'']);}const csv='\ufeff'+rows.map(row=>row.map(v=>{let cell=String(v??'');if(/^[\s]*[=+@-]/.test(cell))cell="'"+cell;return '"'+cell.replace(/"/g,'""')+'"';}).join(',')).join('\r\n');downloadFile(`moc-finance-giao-dich-${localToday()}.csv`,'text/csv;charset=utf-8',csv);toast('Đã xuất danh sách giao dịch','download');}
let pendingImport=null;
function safeImportedState(obj){if(!validateState(obj))throw Error('Tệp không đúng định dạng sao lưu của Mộc.');if(obj.wallets.length>150||obj.categories.length>500||obj.transactions.length>100000||obj.budgets.length>5000)throw Error('Tệp quá lớn hoặc không hợp lệ.');
 const ids=new Set(),categoryIds=new Set();
 const wallets=obj.wallets.map(w=>{if(!w||typeof w.id!=='string'||!w.id||ids.has(w.id)||typeof w.name!=='string'||!Number.isFinite(Number(w.opening)))throw Error('Ví trong tệp không hợp lệ.');ids.add(w.id);return {id:w.id.slice(0,120),name:w.name.slice(0,45),opening:Math.trunc(Number(w.opening)),icon:ICONS[w.icon]?w.icon:'wallet',color:COLORS.includes(w.color)?w.color:COLORS[0]};});
 const cats=obj.categories.map(c=>{if(!c||typeof c.id!=='string'||!c.id||categoryIds.has(c.id)||!['income','expense'].includes(c.type)||typeof c.name!=='string')throw Error('Danh mục trong tệp không hợp lệ.');categoryIds.add(c.id);return {id:c.id.slice(0,120),name:c.name.slice(0,30),type:c.type,icon:ICONS[c.icon]?c.icon:'gift',color:/^#[a-f0-9]{6}$/i.test(c.color)?c.color:'#bdcfc4'};});
 const ts=obj.transactions.map(t=>{if(!t||!['expense','income','transfer'].includes(t.type)||!validAmount(Number(t.amount))||!/^\d{4}-\d{2}-\d{2}$/.test(t.date))throw Error('Giao dịch trong tệp không hợp lệ.');if(t.type==='transfer'&&(!ids.has(t.fromWalletId)||!ids.has(t.toWalletId)||t.fromWalletId===t.toWalletId))throw Error('Ví chuyển tiền không hợp lệ.');if(t.type!=='transfer'&&(!ids.has(t.walletId)||!categoryIds.has(t.categoryId)))throw Error('Giao dịch tham chiếu đến ví hoặc danh mục không tồn tại.');return {id:String(t.id||uuid()).slice(0,120),type:t.type,amount:Math.trunc(Number(t.amount)),date:t.date,note:String(t.note||'').slice(0,120),...(t.type==='transfer'?{fromWalletId:t.fromWalletId,toWalletId:t.toWalletId}:{walletId:t.walletId,categoryId:t.categoryId})};});
 const budgets=obj.budgets.map(b=>{if(!b||!categoryIds.has(b.categoryId)||!validAmount(Number(b.limit))||!/^\d{4}-\d{2}$/.test(b.month))throw Error('Ngân sách trong tệp không hợp lệ.');return {id:String(b.id||uuid()).slice(0,120),categoryId:b.categoryId,month:b.month,limit:Math.trunc(Number(b.limit))};});
 return {version:1,mode:'personal',settings:{name:String(obj.settings.name||'Bạn').slice(0,35),theme:obj.settings.theme==='dark'?'dark':'light'},wallets,categories:cats,transactions:ts,budgets};
}
function handleAction(action,btn){const id=btn.dataset.id;switch(action){
 case'nav':ui.view=btn.dataset.view;ui.search='';ui.filter='all';renderShell();window.scrollTo(0,0);return;
 case'month-prev':ui.month=shiftMonth(ui.month,-1);renderShell();return;
 case'month-next':ui.month=shiftMonth(ui.month,1);renderShell();return;
 case'add-transaction':openModal('transaction');return;
 case'quick-expense':openModal('transaction',null,{type:'expense'});return;
 case'quick-income':openModal('transaction',null,{type:'income'});return;
 case'quick-transfer':if(state.wallets.length<2){toast('Tạo thêm một ví để chuyển tiền.','alert');return;}openModal('transaction',null,{type:'transfer'});return;
 case'edit-transaction':openModal('transaction',id);return;
 case'add-wallet':openModal('wallet');return;
 case'edit-wallet':openModal('wallet',id);return;
 case'add-budget':openModal('budget');return;
 case'budget-for':openModal('budget',null,{categoryId:btn.dataset.category});return;
 case'edit-budget':openModal('budget',id);return;
 case'add-category':openModal('category');return;
 case'edit-name':openModal('name');return;
 case'theme':state.settings.theme=state.settings.theme==='dark'?'light':'dark';setTheme(state.settings.theme);save();renderShell();return;
 case'export-json':exportJSON();return;
 case'export-csv':exportCSV();return;
 case'import-json':document.getElementById('import-input').click();return;
 case'clear-data':confirm('Xóa toàn bộ dữ liệu?','Mọi giao dịch, ví, ngân sách và danh mục tùy chỉnh sẽ bị xóa. Một sổ thu chi trống sẽ được tạo.','clear-data',{danger:true,warning:'Nên xuất sao lưu JSON trước khi xóa. Không thể hoàn tác.',accept:'Xóa tất cả'});return;
 case'start-fresh':confirm('Bắt đầu sổ thu chi mới?','Dữ liệu minh họa sẽ được thay thế bằng ví trống và danh mục mặc định để bạn ghi chép từ đầu.','start-fresh',{danger:false,accept:'Tạo sổ mới'});return;
 case'reset-demo':confirm('Nạp dữ liệu mẫu?','Việc này sẽ thay thế tất cả dữ liệu đang lưu trên trình duyệt bằng dữ liệu trải nghiệm.','reset-demo',{danger:true,warning:'Những thay đổi hiện tại sẽ mất. Nên sao lưu trước.',accept:'Nạp dữ liệu mẫu'});return;
 case'delete-category':confirm('Xóa danh mục?','Danh mục chưa có dữ liệu liên quan sẽ bị xóa.','delete-category',{id,danger:true,accept:'Xóa danh mục'});return;
 case'close-modal':closeModal();return;
 case'delete-current':deleteCurrent();return;
 case'confirm-apply':applyConfirm();return;
 case'set-transaction-type':ui.draft.type=btn.dataset.type;ui.draft.categoryId=state.categories.find(c=>c.type===ui.draft.type)?.id;renderModal();return;
 case'select-category':ui.draft.categoryId=id;renderModal();return;
 case'choose-color':ui.draft.color=btn.dataset.color;renderModal();return;
 }
}
document.addEventListener('click',ev=>{const target=ev.target.closest('[data-action]');if(target){ev.preventDefault();handleAction(target.dataset.action,target);return;}if(ev.target.id==='modal-overlay')closeModal();});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&ui.modal)closeModal();});
document.addEventListener('input',ev=>{const el=ev.target;if(el.id==='tx-search'){ui.search=el.value;const node=document.getElementById('transaction-results');if(node)node.innerHTML=renderTransactionResults();return;}
 if(el.dataset.field&&ui.draft){if(el.dataset.field==='amount'||el.dataset.field==='opening'||el.dataset.field==='limit'){
  const raw=el.value.replace(/[^0-9]/g,'').slice(0,16);const val=Number(raw||0);ui.draft[el.dataset.field]=val;el.value=raw?money(val):'';try{el.setSelectionRange(el.value.length,el.value.length);}catch(_){/* some input types do not support selection */}
 }else ui.draft[el.dataset.field]=el.value;}
});
document.addEventListener('change',ev=>{const el=ev.target;if(el.id==='theme-select'){state.settings.theme=el.value==='dark'?'dark':'light';setTheme(state.settings.theme);save();renderShell();return;}if(el.dataset.field&&ui.draft){ui.draft[el.dataset.field]=['amount','opening','limit'].includes(el.dataset.field)?parseAmount(el.value):el.value;}});
document.addEventListener('submit',ev=>{const f=ev.target;if(!['transaction-form','wallet-form','budget-form','category-form','name-form'].includes(f.id))return;ev.preventDefault();if(f.id==='transaction-form')commitTransaction(f);if(f.id==='wallet-form')commitWallet(f);if(f.id==='budget-form')commitBudget(f);if(f.id==='category-form')commitCategory(f);if(f.id==='name-form'){const name=String(f.elements.name.value||'').trim().slice(0,35);if(!name){showError('Tên không được để trống.');return;}state.settings.name=name;save();closeModal();renderShell();toast('Đã cập nhật tên hiển thị');}});
document.getElementById('import-input').addEventListener('change',async ev=>{const file=ev.target.files?.[0];ev.target.value='';if(!file)return;if(file.size>5*1024*1024){toast('Tệp sao lưu vượt quá 5 MB.','alert');return;}try{pendingImport=safeImportedState(JSON.parse(await file.text()));confirm('Khôi phục dữ liệu?','Toàn bộ dữ liệu đang có trên trình duyệt sẽ được thay thế bằng nội dung tệp sao lưu.','import',{warning:'Hãy sao lưu dữ liệu hiện tại trước khi tiếp tục.',danger:true,accept:'Khôi phục dữ liệu'});}catch(err){toast('Không thể nhập: '+(err.message||'Tệp không hợp lệ.'),'alert');}});
renderShell();
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
 navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
}
})();

</script>
</body>
</html>
