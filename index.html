/* Tamy 2.1 — clear native typography, strong contrast and tap targets. */
html{font-size:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html[data-text-size="large"]{font-size:18px}
html[data-text-size="extra"]{font-size:20px}
:root{--muted:#596c61;--muted-strong:#465e52;--ink:#18322a;--border:#dee7df}
:root[data-theme="dark"]{--muted:#b9c9be;--muted-strong:#d1dfd4;--border:#40574a}
body{font-family:var(--font);font-size:1rem;line-height:1.65;letter-spacing:0}
button,input,select,textarea{font-family:var(--font)}
button,.btn,.quick-action,.link-button,.bottom-nav button{touch-action:manipulation}
input,select,textarea{font-size:1rem;min-height:48px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #459c78;outline-offset:3px}
.sidebar-label,.eyebrow,.overline,.brand-caption{letter-spacing:.025em}
h1,h2,h3{letter-spacing:-.035em}
.page-intro p,.section-head p,.stat-foot,.settings-row p{line-height:1.65}
.quick-action{min-height:66px;padding:15px 13px}
.quick-action small{display:block;line-height:1.45}
.quick-action b{line-height:1.3}
.btn,.btn-small{min-height:44px}
.setting-select{min-height:46px;padding:8px}
.settings-row{align-items:center;gap:12px}
.settings-row-content{min-width:0}
.bottom-nav button{min-height:54px;line-height:1.2;font-size:clamp(12px,.82rem,15px);word-break:normal}
.bottom-nav button span{text-wrap:balance}
.hero-balance{font-variant-numeric:tabular-nums;letter-spacing:-.045em}
.hero-stat .label{color:#e4f5e9}
.tamy-insight small,.stat-label,.txn-meta,.tx-date{line-height:1.55}
@media(max-width:750px){
 .main{min-width:0}
 .main-content{min-width:0}
 .main .topbar{gap:16px}
 .quick-actions{grid-template-columns:repeat(2,minmax(0,1fr))}
 .quick-action{min-width:0}
 .bottom-nav{padding-bottom:calc(9px + env(safe-area-inset-bottom))}
 .settings-row{flex-wrap:wrap}
 .settings-row-content{flex:1 1 180px}
 .setting-select{min-width:120px;max-width:100%}
 .hero-balance{font-size:clamp(28px,7.4vw,38px)}
}
@media(max-width:370px){.bottom-nav button{font-size:12px}.quick-action{padding:12px 9px}.quick-action .qa-icon{width:35px;height:35px}}

const TAMY_DB='tamy-finance-device-backup';
let backupTimer=null, dataChangedSinceLaunch=false, backupWriteChain=Promise.resolve();

function openLocalBackup(){return new Promise((resolve,reject)=>{
 if(!('indexedDB' in window))return reject(new Error('IndexedDB unavailable'));
 const request=indexedDB.open(TAMY_DB,1);
 request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('snapshots'))request.result.createObjectStore('snapshots');};
 request.onsuccess=()=>resolve(request.result);
 request.onerror=()=>reject(request.error);
 request.onblocked=()=>reject(new Error('IndexedDB is blocked'));
});}
async function writeBackup(snapshot){
 let db;
 try{db=await openLocalBackup();await new Promise((resolve,reject)=>{
   const tx=db.transaction('snapshots','readwrite');
   tx.objectStore('snapshots').put({snapshot,savedAt:Date.now()},'latest');
   tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);
 });}catch(err){console.warn('Không thể lưu bản dự phòng IndexedDB:',err);}
 finally{db?.close();}
}
function queueBackup(){clearTimeout(backupTimer);const snapshot=clone(state);backupTimer=setTimeout(()=>{backupWriteChain=backupWriteChain.then(()=>writeBackup(snapshot));},250);}
async function restoreBackupWhenNeeded(){
 if(hadLocalDataAtStart||dataChangedSinceLaunch)return;
 let db;
 try{db=await openLocalBackup();const saved=await new Promise((resolve,reject)=>{
   const tx=db.transaction('snapshots','readonly');const req=tx.objectStore('snapshots').get('latest');
   req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
 });
 if(saved && validateState(saved.snapshot) && !dataChangedSinceLaunch){
   state=saved.snapshot;state.creditCards=Array.isArray(state.creditCards)?state.creditCards:[];state.creditEntries=Array.isArray(state.creditEntries)?state.creditEntries:[];setTheme(state.settings.theme);setTextSize(state.settings.textSize);
   try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(_){}
   renderShell();toast('Đã khôi phục dữ liệu từ bản lưu trên thiết bị.','success');
 }}catch(err){console.warn('Không thể đọc bản dự phòng IndexedDB:',err);}finally{db?.close();}
}

function emptyBlock(ico,heading,desc,action,label){return `<div class="empty-state"><div class="empty-icon">${icons(ico,'icon-lg')}</div><b>${escapeHtml(heading)}</b><p>${escapeHtml(desc)}</p>${action?`<button class="btn btn-soft btn-small" data-action="${action}">${icons('plus','icon-sm')} ${escapeHtml(label||'Thêm mới')}</button>`:''}</div>`;}
function lineChart(ym){const days=monthDays(ym),ts=transactionsForMonth(ym),nums=Array.from({length:days},()=>0);ts.filter(t=>t.type==='expense').forEach(t=>{const day=Number(t.date.slice(8));if(day>0 && day<=days)nums[day-1]+=number(t.amount);});let v=0;const cum=nums.map(n=>(v+=n));const ymax=Math.max(1000000,...cum)*1.12;const W=640,H=213,L=50,R=15,T=12,B=28,plotW=W-L-R,plotH=H-T-B;const x=i=>L+i*plotW/Math.max(1,days-1),y=n=>T+plotH-n/ymax*plotH;const pts=cum.map((val,i)=>[x(i),y(val)]);const line=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');const area=`${line} L${x(days-1)} ${T+plotH} L${L} ${T+plotH} Z`;const ticks=[0,.25,.5,.75,1].map(fr=>{let yy=T+plotH*(1-fr);return `<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" class="chart-grid-line"/><text class="chart-grid-label" x="${L-9}" y="${yy+3}" text-anchor="end">${compactMoney(ymax*fr)}</text>`;}).join('');const dates=[1,Math.round(days*.25),Math.round(days*.5),Math.round(days*.75),days].map(d=>`<text class="chart-grid-label" x="${x(d-1)}" y="${H-5}" text-anchor="middle">${d}/${Number(ym.slice(5))}</text>`).join('');return `<div class="chart-wrap"><svg class="line-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ chi tiêu lũy kế tháng ${escapeHtml(ym)}"><defs><linearGradient id="areaGradient" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#4aad87" stop-opacity=".20"/><stop offset="1" stop-color="#4aad87" stop-opacity=".005"/></linearGradient></defs>${ticks}${dates}<path d="${area}" class="chart-area"/><path d="${line}" class="chart-line"/>${cum.length?`<circle class="chart-dot" cx="${x(days-1)}" cy="${y(cum[days-1])}" r="5"><title>${fullMoney(cum[days-1])}</title></circle>`:''}</svg></div>`;}
function renderDonut(ym){const list=categorySpends(ym),total=list.reduce((a,it)=>a+it.value,0);if(!total)return emptyBlock('chart-pie','Chưa có chi tiêu','Khi có giao dịch chi tiêu, biểu đồ sẽ xuất hiện.');let last=0;const arcs=list.map(it=>{const next=last+it.value/total*100;const chunk=`${it.cat.color} ${last.toFixed(2)}% ${next.toFixed(2)}%`;last=next;return chunk;});return `<div class="donut-layout"><div class="donut" style="background:conic-gradient(${arcs.join(',')})" role="img" aria-label="Chi tiêu phân theo danh mục"><div class="donut-hole"><small>Tổng chi</small><b class="mono-num">${compactMoney(total)}</b></div></div><div class="donut-legend">${list.slice(0,5).map(it=>`<div class="legend-row"><div class="legend-name"><i class="color-dot" style="background:${it.cat.color}"></i>${escapeHtml(it.cat.name)}</div><b>${Math.round(it.value/total*100)}%</b></div>`).join('')}</div></div>`;}
function renderTxItem(t){const kind=t.type,cat=kind==='transfer'?{name:'Chuyển giữa các ví',color:'#c9d7e1',icon:'swap'}:category(t.categoryId),title=t.note || (kind==='transfer'? 'Chuyển tiền':cat.name);const w=t.creditEntryId?`Thẻ: ${cardName(t.cardId)}`:kind==='transfer'?`${wallet(t.fromWalletId).name} → ${wallet(t.toWalletId).name}`:wallet(t.walletId).name;const amountText=kind==='income'?`+${fullMoney(t.amount)}`:kind==='expense'?`−${fullMoney(t.amount)}`:fullMoney(t.amount);return `<button class="tx-item" data-action="${t.creditEntryId?'edit-credit-entry':'edit-transaction'}" data-id="${escapeHtml(t.creditEntryId||t.id)}" aria-label="Sửa giao dịch ${escapeHtml(title)}"><div class="tx-icon" style="background:${cat.color}38;color:${cat.color}">${icons(cat.icon)}</div><div class="tx-content"><div class="tx-title">${escapeHtml(title)}</div><div class="tx-desc">${escapeHtml(cat.name)} · ${escapeHtml(w)} · ${dateLabel(t.date)}</div></div><div class="tx-value mono-num ${kind==='income'?'income':kind==='expense'?'bad':''}">${amountText}</div></button>`;}
function renderBudgetRow(b){const cat=category(b.categoryId),spent=budgetSpent(b),percent=b.limit>0?Math.round(spent/b.limit*100):0,over=spent>b.limit,color=over?'#e67d72':'#4da882';return `<div class="budget-row"><div class="budget-head"><span class="budget-icon" style="background:${cat.color}35;color:${cat.color}">${icons(cat.icon)}</span><div class="budget-text"><b>${escapeHtml(cat.name)}</b><small>Đã dùng ${fullMoney(spent)}</small></div><b class="percent ${over?'bad':''}">${percent}%</b></div><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,Math.max(0,percent))}%;background:${color}"></div></div><div class="budget-bottom"><span>${over?'Vượt ngân sách '+fullMoney(spent-b.limit):'Còn '+fullMoney(Math.max(0,b.limit-spent))}</span><b>Giới hạn ${fullMoney(b.limit)}</b></div></div>`;}
function renderTransactions(){const t=totals();return `${renderIntro()}<div class="grid grid-3 space-bottom"><div class="stat-tile"><div class="icon-top">${icons('arrow-down-left')}</div><p class="stat-label">Thu nhập trong tháng</p><div class="stat-amount good mono-num">+${fullMoney(t.income)}</div><p class="stat-foot">${monthLabel(ui.month)}</p></div><div class="stat-tile"><div class="icon-top" style="color:var(--red)">${icons('arrow-up-right')}</div><p class="stat-label">Chi tiêu trong tháng</p><div class="stat-amount mono-num">${fullMoney(t.expense)}</div><p class="stat-foot">${monthLabel(ui.month)}</p></div><div class="stat-tile"><div class="icon-top">${icons('wallet')}</div><p class="stat-label">Chênh lệch thu − chi</p><div class="stat-amount mono-num ${t.income-t.expense<0?'bad':'good'}">${fullMoney(t.income-t.expense)}</div><p class="stat-foot">Không tính chuyển ví</p></div></div>
 <section class="card"><div class="section-head"><div><h2>Lịch sử giao dịch</h2><p>Tìm nhanh và chỉnh sửa bất kỳ khoản thu chi nào</p></div><button class="btn btn-primary btn-small" data-action="add-transaction">${icons('plus','icon-sm')} <span>Thêm mới</span></button></div><div class="filter-row"><label class="searchbar">${icons('search','icon-sm')}<input type="search" id="tx-search" placeholder="Tìm mô tả, danh mục hoặc ví..." value="${escapeHtml(ui.search)}" aria-label="Tìm giao dịch" /></label><div class="segment" role="group" aria-label="Loại giao dịch">${[['all','Tất cả'],['expense','Khoản chi'],['income','Khoản thu'],['transfer','Chuyển ví']].map(([key,label])=>`<button class="${ui.filter===key?'selected':''}" data-action="filter" data-filter="${key}">${label}</button>`).join('')}</div></div><div id="transaction-results">${renderTransactionResults()}</div></section>`;}
function renderTransactionResults(){const items=transactionsForMonth().filter(t=>ui.filter==='all'||t.type===ui.filter).filter(t=>{if(!ui.search.trim())return true;const c=t.type==='transfer'?'Chuyển ví':category(t.categoryId).name;const w=t.creditEntryId?cardName(t.cardId):t.type==='transfer'?wallet(t.fromWalletId).name+' '+wallet(t.toWalletId).name:wallet(t.walletId).name;return normalize(`${t.note} ${c} ${w} ${t.amount} ${dateLabel(t.date)}`).includes(normalize(ui.search));});if(!items.length)return emptyBlock('receipt','Không tìm thấy giao dịch','Hãy đổi bộ lọc hoặc thêm giao dịch mới.','add-transaction','Thêm giao dịch');const groups={};items.forEach(t=>{(groups[t.date]??=[]).push(t);});return Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0])).map(([date,list])=>`<div class="tx-group"><div class="tx-group-header"><span>${date===localToday()?'Hôm nay':dateLabel(date)}</span><small>${list.length} giao dịch</small></div><div class="transaction-list">${list.map(renderTxItem).join('')}</div></div>`).join('');}
// ----------------- CREDIT CARDS -----------------
function cardName(id){return (state.creditCards||[]).find(c=>c.id===id)?.name||'Thẻ đã xóa';}
function creditEntries(cardId){return (state.creditEntries||[]).filter(e=>e.cardId===cardId);}
function cardDebt(cardId,exclude=null){const card=(state.creditCards||[]).find(c=>c.id===cardId);if(!card)return 0;return Math.max(0,number(card.openingDebt)+creditEntries(cardId).filter(e=>e.id!==exclude).reduce((sum,e)=>sum+(e.kind==='charge'?1:-1)*number(e.amount),0));}
function cardAvailable(card){return Math.max(0,number(card.limit)-cardDebt(card.id));}
function dayOfMonth(ym,day){return ym+'-'+String(Math.min(Math.max(1,Number(day)||1),monthDays(ym))).padStart(2,'0');}
function cardStatementDate(chargeDate,card){let ym=chargeDate.slice(0,7),close=dayOfMonth(ym,card.closingDay);if(chargeDate>close){ym=shiftMonth(ym,1);close=dayOfMonth(ym,card.closingDay);}return close;}
function cardDueDate(chargeDate,card){const close=cardStatementDate(chargeDate,card),ym=close.slice(0,7);let due=dayOfMonth(ym,card.dueDay);if(due<=close)due=dayOfMonth(shiftMonth(ym,1),card.dueDay);return due;}
function daysBetween(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);}
function cardDueInfo(card){const entries=creditEntries(card.id);let payments=entries.filter(e=>e.kind==='payment').reduce((n,e)=>n+number(e.amount),0);
 // Payments settle the oldest debt first. Opening debt has no known statement date.
 const openingRemain=Math.max(0,number(card.openingDebt)-payments);payments=Math.max(0,payments-number(card.openingDebt));
 const obligations=entries.filter(e=>e.kind==='charge').map(e=>({...e,due:cardDueDate(e.date,card)})).sort((a,b)=>a.due.localeCompare(b.due)||a.date.localeCompare(b.date));
 let remaining=[];for(const e of obligations){const unpaid=Math.max(0,number(e.amount)-payments);payments=Math.max(0,payments-number(e.amount));if(unpaid>0)remaining.push({...e,unpaid});}
 const earliest=remaining[0]?.due||null,amount=earliest?remaining.filter(e=>e.due===earliest).reduce((s,e)=>s+e.unpaid,0):0;
 return {due:earliest,amount,openingRemain,days:earliest?daysBetween(localToday(),earliest):null};
}
function renderCreditCard(card){const debt=cardDebt(card.id),available=cardAvailable(card),use=number(card.limit)?Math.min(100,Math.round(debt/card.limit*100)):0,due=cardDueInfo(card),warning=due.due&&due.days<=7;
 return `<section class="credit-card-item"><div class="credit-card-design"><div class="credit-card-top"><span class="credit-card-chip">✦ TAMY CREDIT</span><span class="credit-contactless">◉</span></div><div class="credit-card-middle"><span>DƯ NỢ HIỆN TẠI</span><strong>${fullMoney(debt)}</strong></div><div class="credit-card-bottom"><span>${escapeHtml(card.name)}${card.last4?' · •••• '+escapeHtml(card.last4):''}</span><span>TAMY · CREDIT</span></div></div><div class="credit-item-body"><div class="credit-number-grid"><div><span>Hạn mức</span><b>${fullMoney(card.limit)}</b></div><div><span>Còn khả dụng</span><b>${fullMoney(available)}</b></div></div><div class="credit-track"><span style="width:${use}%" class="${use>=80?'high':''}"></span></div><div class="credit-micro"><span>Đã sử dụng ${use}% hạn mức</span><span>Chốt ngày ${card.closingDay} · Trả ngày ${card.dueDay}</span></div>${due.due?`<div class="credit-due ${warning?'credit-alert':''}"><span>◷ <b>${due.days<0?'Quá hạn dự kiến':due.days<=7?'Sắp đến hạn':'Hạn thanh toán dự kiến'}</b> ${dateLabel(due.due)}</span><strong>${fullMoney(due.amount)}</strong></div>`:due.openingRemain>0?`<div class="credit-due">Dư nợ đầu kỳ ${fullMoney(due.openingRemain)} · Hãy đối chiếu sao kê ngân hàng.</div>`:`<div class="credit-due credit-calm">✓ Chưa có khoản quẹt thẻ chờ thanh toán</div>`}<div class="credit-card-actions"><button class="btn btn-primary" data-action="credit-charge" data-id="${escapeHtml(card.id)}">+ Ghi quẹt thẻ</button><button class="btn btn-outline" data-action="credit-payment" data-id="${escapeHtml(card.id)}">Trả nợ</button><button class="credit-settings" data-action="credit-edit-card" data-id="${escapeHtml(card.id)}" aria-label="Sửa thẻ ${escapeHtml(card.name)}">${icons('settings','icon-sm')}</button></div></div></section>`;
}
function renderCreditCards(){const cards=state.creditCards||[],allDebt=cards.reduce((n,c)=>n+cardDebt(c.id),0),allLimit=cards.reduce((n,c)=>n+number(c.limit),0),earliest=cards.map(cardDueInfo).filter(i=>i.due).sort((a,b)=>a.due.localeCompare(b.due))[0];
 const entries=(state.creditEntries||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
 return `${renderIntro()}<div class="credit-page-head"><div><div class="premium-kicker">✦ KIỂM SOÁT TỪNG KỲ SAO KÊ</div><h2>Thẻ tín dụng của bạn</h2><p>Quẹt thẻ là chi tiêu. Trả nợ chỉ chuyển tiền từ ví để giảm dư nợ — không tính chi hai lần.</p></div><button class="btn btn-primary" data-action="credit-add-card">${icons('plus','icon-sm')} Thêm thẻ</button></div><div class="credit-metrics"><div class="credit-metric"><span>Tổng dư nợ</span><b>${fullMoney(allDebt)}</b><small>Từ ${cards.length} thẻ đang theo dõi</small></div><div class="credit-metric"><span>Hạn mức còn lại</span><b>${fullMoney(Math.max(0,allLimit-allDebt))}</b><small>Tổng hạn mức ${fullMoney(allLimit)}</small></div><div class="credit-metric"><span>Kỳ trả gần nhất</span><b>${earliest?dateLabel(earliest.due):'Chưa có'}</b><small>${earliest?`${fullMoney(earliest.amount)} cần đối chiếu sao kê`:'Không có khoản trả theo kỳ'}</small></div></div>${cards.length?`<div class="credit-cards-grid">${cards.map(renderCreditCard).join('')}</div>`:`<div class="credit-empty"><div class="credit-empty-mark">💳</div><h3>Thêm thẻ đầu tiên</h3><p>Theo dõi hạn mức, ngày sao kê, lịch sử quẹt thẻ và số tiền đã trả. Chỉ cần tên thẻ và 4 số cuối, không nhập số thẻ đầy đủ.</p><button class="btn btn-primary" data-action="credit-add-card">+ Thêm thẻ tín dụng</button></div>`}
 <section class="card space-top"><div class="section-head"><div><h2>Lịch sử thẻ tín dụng</h2><p>Giao dịch quẹt thẻ và thanh toán được lưu tách bạch</p></div></div>${entries.length?`<div class="transaction-list">${entries.map(e=>`<button class="tx-item" data-action="edit-credit-entry" data-id="${escapeHtml(e.id)}"><div class="tx-icon" style="background:${e.kind==='charge'?'#fff0e9':'#e6f5ec'};color:${e.kind==='charge'?'#ba7449':'#2c845e'}">${icons(e.kind==='charge'?'shopping':'arrow-down-left')}</div><div class="tx-content"><div class="tx-title">${escapeHtml(e.note||(e.kind==='charge'?category(e.categoryId).name:'Thanh toán thẻ'))}</div><div class="tx-desc">${escapeHtml(cardName(e.cardId))} · ${e.kind==='charge'?'Quẹt thẻ':'Trả nợ'} · ${dateLabel(e.date)}</div></div><div class="tx-value mono-num ${e.kind==='charge'?'bad':'good'}">${e.kind==='charge'?'−':'+'}${fullMoney(e.amount)}</div></button>`).join('')}</div>`:emptyBlock('wallet','Chưa có giao dịch thẻ','Ghi lần quẹt thẻ đầu tiên để theo dõi dư nợ.')}</section><p class="credit-note">ⓘ Ngày đến hạn và số dư theo kỳ được Tamy ước tính từ ngày chốt/trả bạn nhập, không thay thế sao kê ngân hàng. Không lưu số thẻ đầy đủ, CVV hoặc mật khẩu.</p>`;

function renderCreditCardModal(){const d=ui.draft,edit=!!ui.modal.id;return `${modalHeading(edit?'Cập nhật thẻ':'Thêm thẻ tín dụng','Chỉ nhập thông tin quản lý, không cần số thẻ đầy đủ.')}<form class="modal-content" id="credit-card-form"><div class="form-field"><label class="form-label" for="card-name">Tên thẻ / ngân hàng</label><input id="card-name" name="name" class="form-control" maxlength="45" placeholder="Ví dụ: Visa Cashback / MB Bank" value="${escapeHtml(d.name||'')}" required></div><div class="form-row"><div class="form-field"><label class="form-label" for="card-last4">4 số cuối (tùy chọn)</label><input id="card-last4" name="last4" class="form-control" inputmode="numeric" pattern="[0-9]{0,4}" maxlength="4" placeholder="••••" value="${escapeHtml(d.last4||'')}"></div><div class="form-field"><label class="form-label" for="card-limit">Hạn mức (đ)</label><input id="card-limit" name="limit" class="form-control" inputmode="numeric" placeholder="20.000.000" value="${d.limit?money(d.limit):''}" required></div></div><div class="form-row"><div class="form-field"><label class="form-label" for="card-closing">Ngày chốt sao kê</label><select id="card-closing" name="closingDay" class="form-control">${Array.from({length:31},(_,i)=>`<option value="${i+1}" ${number(d.closingDay)===i+1?'selected':''}>Ngày ${i+1}</option>`).join('')}</select></div><div class="form-field"><label class="form-label" for="card-due">Ngày đến hạn trả</label><select id="card-due" name="dueDay" class="form-control">${Array.from({length:31},(_,i)=>`<option value="${i+1}" ${number(d.dueDay)===i+1?'selected':''}>Ngày ${i+1}</option>`).join('')}</select></div></div><div class="form-field"><label class="form-label" for="card-opening">Dư nợ đầu kỳ (đ)</label><input id="card-opening" name="openingDebt" class="form-control" inputmode="numeric" placeholder="0" value="${d.openingDebt?money(d.openingDebt):''}"><small class="muted">Nếu thẻ đã có dư nợ trước khi dùng Tamy, nhập số này. Hạn trả của dư nợ đầu kỳ cần đối chiếu ngân hàng.</small></div>${modalFormFooter(edit,'Lưu thẻ')}</form>`;}
function renderCreditEntryModal(){const d=ui.draft,edit=!!ui.modal.id,pay=d.kind==='payment',cards=state.creditCards||[];return `${modalHeading(edit?'Chỉnh sửa giao dịch thẻ':pay?'Thanh toán dư nợ':'Ghi quẹt thẻ',pay?'Trả dư nợ từ ví của bạn — không ghi thêm chi tiêu.':'Ghi lại khoản chi qua thẻ, không trừ tiền từ ví ngay.')}<form class="modal-content" id="credit-entry-form"><div class="type-switch"><button type="button" class="${!pay?'active':''}" data-action="credit-set-kind" data-kind="charge">↗ Quẹt thẻ</button><button type="button" class="${pay?'active':''}" data-action="credit-set-kind" data-kind="payment">✓ Trả nợ</button></div><div class="form-field"><label class="form-label" for="ce-card">Thẻ tín dụng</label><select id="ce-card" name="cardId" class="form-control">${cards.map(c=>`<option value="${escapeHtml(c.id)}" ${c.id===d.cardId?'selected':''}>${escapeHtml(c.name)}${c.last4?' ••••'+escapeHtml(c.last4):''}</option>`).join('')}</select></div><div class="amount-field"><div class="amount-label">${pay?'Số tiền trả thẻ':'Số tiền quẹt thẻ'}</div><div class="amount-input-wrap"><input id="ce-amount" class="amount-input mono-num" name="amount" inputmode="numeric" autocomplete="off" placeholder="0" value="${d.amount?money(d.amount):''}" required><span>đ</span></div></div>${pay?`<div class="form-field"><label class="form-label" for="ce-wallet">Trả tiền từ ví</label><select id="ce-wallet" name="walletId" class="form-control">${walletOptions(d.walletId)}</select><small class="muted">Chỉ giảm số dư ví và dư nợ; không tính vào chi tiêu lần nữa.</small></div>`:`<div class="form-field"><label class="form-label" for="ce-category">Danh mục chi tiêu</label><select id="ce-category" name="categoryId" class="form-control">${state.categories.filter(c=>c.type==='expense').map(c=>`<option value="${escapeHtml(c.id)}" ${c.id===d.categoryId?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select></div>`}<div class="form-row"><div class="form-field"><label class="form-label" for="ce-date">Ngày giao dịch</label><input id="ce-date" name="date" type="date" class="form-control" value="${escapeHtml(d.date)}" required></div><div class="form-field"><label class="form-label" for="ce-note">Ghi chú</label><input id="ce-note" name="note" class="form-control" maxlength="120" placeholder="Ví dụ: Mua sắm" value="${escapeHtml(d.note||'')}"></div></div>${modalFormFooter(edit,'Lưu giao dịch thẻ')}</form>`;}
function commitCreditCard(form){const name=String(form.elements.name.value||'').trim().slice(0,45),last4=String(form.elements.last4.value||'').trim(),limit=parseAmount(form.elements.limit.value),openingDebt=parseAmount(form.elements.openingDebt.value||'0'),closingDay=Number(form.elements.closingDay.value),dueDay=Number(form.elements.dueDay.value);if(!name)return showError('Hãy nhập tên thẻ.');if(last4&&!/^\d{4}$/.test(last4))return showError('Chỉ dùng đúng 4 số cuối của thẻ, không nhập số thẻ đầy đủ.');if(!validAmount(limit))return showError('Hạn mức phải lớn hơn 0.');if(!Number.isFinite(openingDebt)||openingDebt<0||openingDebt>1e12)return showError('Dư nợ đầu kỳ không hợp lệ.');if(limit>1e12)return showError('Hạn mức quá lớn.');if(!Number.isInteger(closingDay)||closingDay<1||closingDay>31||!Number.isInteger(dueDay)||dueDay<1||dueDay>31)return showError('Chọn ngày chốt và hạn trả hợp lệ.');const card={id:ui.modal.id||uuid(),name,last4,limit,openingDebt,closingDay,dueDay};const charged=creditEntries(card.id).filter(e=>e.kind==='charge').reduce((n,e)=>n+number(e.amount),0),paid=creditEntries(card.id).filter(e=>e.kind==='payment').reduce((n,e)=>n+number(e.amount),0);if(openingDebt+charged<paid)return showError('Dư nợ đầu kỳ không thể thấp hơn số đã thanh toán trừ các khoản quẹt.');if(ui.modal.id){const index=state.creditCards.findIndex(c=>c.id===ui.modal.id);if(index<0)return showError('Không tìm thấy thẻ.');state.creditCards[index]=card;}else state.creditCards.push(card);save();closeModal();renderShell();toast('Đã lưu thẻ tín dụng');}
function commitCreditEntry(form){const d=ui.draft,cardId=form.elements.cardId.value,kind=d.kind||'charge',amount=parseAmount(form.elements.amount.value),date=String(form.elements.date.value||''),note=String(form.elements.note.value||'').trim().slice(0,120),excl=ui.modal.id;if(!state.creditCards.some(c=>c.id===cardId))return showError('Chọn thẻ tín dụng hợp lệ.');if(!validAmount(amount))return showError('Hãy nhập số tiền lớn hơn 0.');if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(new Date(date+'T12:00:00').getTime()))return showError('Ngày giao dịch không hợp lệ.');const e={id:excl||uuid(),kind,cardId,amount,date,note};if(kind==='payment'){e.walletId=form.elements.walletId.value;if(!state.wallets.some(w=>w.id===e.walletId))return showError('Chọn ví thanh toán hợp lệ.');const old=excl?state.creditEntries.find(x=>x.id===excl):null;const allowed=cardDebt(cardId,excl);if(amount>allowed)return showError(`Số tiền trả vượt dư nợ ${fullMoney(allowed)}. Hãy kiểm tra lại.`);}else{e.categoryId=form.elements.categoryId.value;if(!state.categories.some(c=>c.id===e.categoryId&&c.type==='expense'))return showError('Hãy chọn danh mục chi tiêu.');const existing=excl?state.creditEntries.find(x=>x.id===excl):null;const currentPaid=creditEntries(cardId).filter(x=>x.kind==='payment'&&x.id!==excl).reduce((n,x)=>n+number(x.amount),0);const existingCharges=creditEntries(cardId).filter(x=>x.kind==='charge'&&x.id!==excl).reduce((n,x)=>n+number(x.amount),0);const opening=number(state.creditCards.find(x=>x.id===cardId)?.openingDebt);if(opening+existingCharges+amount<currentPaid)return showError('Khoản quẹt đã được thanh toán một phần. Hãy sửa hoặc xóa khoản trả nợ trước.');}if(excl){const index=state.creditEntries.findIndex(x=>x.id===excl);if(index<0)return showError('Không tìm thấy giao dịch.');state.creditEntries[index]=e;}else state.creditEntries.unshift(e);save();closeModal();renderShell();toast(kind==='charge'?'Đã ghi khoản quẹt thẻ':'Đã lưu thanh toán thẻ — không tính chi tiêu hai lần');}

function renderBudgets(){const list=state.budgets.filter(b=>b.month===ui.month),allocated=list.reduce((n,b)=>n+number(b.limit),0),spent=list.reduce((n,b)=>n+budgetSpent(b),0),allSpent=totals().expense;return `${renderIntro()}<div class="grid grid-3 space-bottom"><div class="stat-tile"><div class="icon-top">${icons('target')}</div><p class="stat-label">Tổng ngân sách đã đặt</p><div class="stat-amount mono-num">${fullMoney(allocated)}</div><p class="stat-foot">${list.length} danh mục được theo dõi</p></div><div class="stat-tile"><div class="icon-top" style="color:var(--red)">${icons('arrow-up-right')}</div><p class="stat-label">Đã dùng trong ngân sách</p><div class="stat-amount mono-num">${fullMoney(spent)}</div><p class="stat-foot">${allocated?Math.round(spent/allocated*100)+'% hạn mức':'Chưa có hạn mức'}</p></div><div class="stat-tile"><div class="icon-top">${icons('shield')}</div><p class="stat-label">Ngân sách còn lại</p><div class="stat-amount mono-num ${allocated-spent<0?'bad':'good'}">${fullMoney(allocated-spent)}</div><p class="stat-foot">Tổng chi mọi danh mục: ${fullMoney(allSpent)}</p></div></div>
 <section class="card"><div class="section-head"><div><h2>Ngân sách ${monthLabel(ui.month).toLowerCase()}</h2><p>Đặt giới hạn phù hợp từng mục chi tiêu</p></div><button class="btn btn-primary btn-small" data-action="add-budget">${icons('plus','icon-sm')} Ngân sách</button></div>${list.length?`<div class="grid grid-2">${list.map(b=>`<div style="padding:5px 1px 9px"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><h3>${escapeHtml(category(b.categoryId).name)}</h3><button class="btn btn-outline btn-small" data-action="edit-budget" data-id="${escapeHtml(b.id)}">${icons('edit','icon-xs')} Sửa</button></div>${renderBudgetRow(b)}</div>`).join('')}</div>`:emptyBlock('target','Chưa có ngân sách','Lập ngân sách đầu tiên để giữ chi tiêu trong kế hoạch.','add-budget','Tạo ngân sách')}</section>
 <div class="grid grid-2 space-top"><section class="card"><div class="section-head"><div><h2>Chi tiêu chưa có ngân sách</h2><p>Những danh mục bạn có thể cân nhắc</p></div></div>${(()=>{const entries=categorySpends().filter(v=>!list.some(b=>b.categoryId===v.cat.id)).slice(0,5);return entries.length?entries.map(it=>`<div class="settings-row"><div class="settings-row-content"><div class="budget-icon" style="background:${it.cat.color}35;color:${it.cat.color}">${icons(it.cat.icon)}</div><div><strong>${escapeHtml(it.cat.name)}</strong><p>Đã dùng ${fullMoney(it.value)}</p></div></div><button class="btn btn-soft btn-small" data-action="budget-for" data-category="${escapeHtml(it.cat.id)}">Đặt mức</button></div>`).join(''):emptyBlock('check-circle','Đã theo dõi đầy đủ','Tất cả danh mục có phát sinh chi đều đã có ngân sách.');})()}</section><div class="tip-card" style="align-self:start"><div class="tip-icon">${icons('sparkle')}</div><div><h3>Quy tắc nhỏ để chi tiêu dễ hơn</h3><p>Hãy bắt đầu với 3–4 danh mục hay sử dụng, chẳng hạn Ăn uống, Di chuyển và Mua sắm. Khi quen, bạn có thể mở rộng ngân sách cho mọi nhu cầu.</p></div></div></div>`;}
function renderWallets(){const all=totalBalance();return `${renderIntro()}<section class="wallet-summary"><div><p class="label">Tổng tài sản đang theo dõi</p><strong class="mono-num">${fullMoney(all)}</strong><p style="font-size:0.84375rem;opacity:.75;margin-top:6px">${state.wallets.length} ví và tài khoản được kết nối thủ công</p></div><button class="btn btn-small" data-action="quick-transfer">${icons('swap','icon-sm')} Chuyển giữa các ví</button></section><div class="section-head"><div><h2>Danh sách ví</h2><p>Tự ghi nhận giao dịch, không cần kết nối ngân hàng</p></div></div><div class="grid grid-wallets">${state.wallets.map(w=>`<section class="wallet-card"><div class="wallet-head"><div class="wallet-icon" style="background:${w.color}38;color:${w.color}">${icons(w.icon)}</div><button class="more-button" data-action="edit-wallet" data-id="${escapeHtml(w.id)}" aria-label="Chỉnh sửa ${escapeHtml(w.name)}">${icons('more')}</button></div><div class="wallet-title">${escapeHtml(w.name)}</div><div class="wallet-amount mono-num">${fullMoney(walletBalance(w.id))}</div><div class="wallet-foot">Số dư ban đầu: ${fullMoney(w.opening)}</div></section>`).join('')}<button class="wallet-card add-wallet" data-action="add-wallet"><span class="plus-box">${icons('plus')}</span><b>Thêm ví mới</b><span>Tiền mặt, ngân hàng, tiết kiệm...</span></button></div><div class="grid grid-2 space-top"><section class="card"><div class="section-head"><div><h2>Hoạt động gần đây</h2><p>Giao dịch của tất cả ví trong tháng</p></div><button class="link-button" data-action="nav" data-view="transactions">Xem toàn bộ ${icons('chev-right','icon-xs')}</button></div>${transactionsForMonth().length?transactionsForMonth().slice(0,6).map(renderTxItem).join(''):emptyBlock('wallet','Chưa có hoạt động','Bắt đầu ghi khoản thu hoặc chi.','add-transaction','Thêm giao dịch')}</section><div class="tip-card" style="align-self:start"><div class="tip-icon">${icons('shield')}</div><div><h3>Các ví hoạt động độc lập</h3><p>Bạn có thể tạo ví Tiền mặt, Ngân hàng hay Tiết kiệm. Mỗi giao dịch sẽ cộng hoặc trừ đúng ví được chọn. Chuyển ví không được tính là thu nhập hay chi tiêu.</p></div></div></div>`;}
function sixMonths(){return Array.from({length:6},(_,i)=>shiftMonth(ui.month,i-5));}
function reportBars(){const months=sixMonths(),v=months.map(m=>({month:m,...totals(m)})),max=Math.max(1,...v.flatMap(x=>[x.income,x.expense]));return `<div class="report-bars">${v.map(it=>`<div class="bar-group"><div class="bar-pair"><div class="bar bar-income" style="height:${Math.max(2,it.income/max*100)}%" title="Thu nhập ${monthLabel(it.month)}: ${fullMoney(it.income)}"></div><div class="bar bar-expense" style="height:${Math.max(2,it.expense/max*100)}%" title="Chi tiêu ${monthLabel(it.month)}: ${fullMoney(it.expense)}"></div></div><span>${Number(it.month.slice(5))}/${it.month.slice(2,4)}</span></div>`).join('')}</div><div class="report-legend"><span><i style="background:#3f9877"></i> Thu nhập</span><span><i style="background:#f2aa83"></i> Chi tiêu</span></div>`;}
// ----------------- TAMY SMART: PRIVATE RULE-BASED FINANCIAL INSIGHTS -----------------
function smartInsights(){const t=totals(),prev=totals(shiftMonth(ui.month,-1)),tips=[],cards=state.creditCards||[],today=localToday(),current=ui.month===thisMonth();
 const add=(icon,title,body,level='neutral')=>tips.push({icon,title,body,level});
 const due=cards.map(c=>({card:c,...cardDueInfo(c)})).filter(x=>x.due&&x.days<=7).sort((a,b)=>a.days-b.days);
 for(const d of due.slice(0,2))add('💳',d.days<0?'Có khoản thẻ đã quá hạn dự kiến':'Sắp đến hạn thanh toán thẻ',`${d.card.name}: ${fullMoney(d.amount)} · hạn ${dateLabel(d.due)}. Hãy xác nhận số cần trả trên sao kê ngân hàng.`,'high');
 const over=(state.budgets||[]).filter(b=>b.month===ui.month&&budgetSpent(b)>=number(b.limit)*.9).sort((a,b)=>budgetSpent(b)/b.limit-budgetSpent(a)/a.limit);
 for(const b of over.slice(0,2)){let spent=budgetSpent(b),percent=Math.round(spent/Math.max(1,b.limit)*100);add('◈',percent>=100?'Ngân sách đã vượt hạn mức':'Ngân sách gần hết',`${category(b.categoryId).name}: đã dùng ${fullMoney(spent)} / ${fullMoney(b.limit)} (${percent}%).${percent>=100?' Cân nhắc giảm các khoản không cần thiết.':' Theo dõi các khoản phát sinh còn lại.'}`,percent>=100?'high':'medium');}
 for(const c of cards){let pct=number(c.limit)>0?Math.round(cardDebt(c.id)/c.limit*100):0;if(pct>=80)add('▣','Hạn mức thẻ đang sử dụng cao',`${c.name} đã dùng ${pct}% hạn mức. Cân nhắc giảm sử dụng thẻ và kiểm tra sao kê.`,'medium');}
 if(prev.expense>0&&t.expense>prev.expense*1.2)add('↗','Chi tiêu tăng so với tháng trước',`Tháng ${ui.month.slice(5)} chi ${fullMoney(t.expense)}, tăng ${Math.round((t.expense/prev.expense-1)*100)}% so với tháng trước. Kiểm tra lại các khoản lớn.`,'medium');
 if(t.income>0&&t.expense>t.income)add('↘','Dòng tiền tháng đang âm',`Chi tiêu đang lớn hơn thu nhập ${fullMoney(t.expense-t.income)}. Ưu tiên khoản thiết yếu và đặt giới hạn cho các danh mục phụ.`,'high');
 if(current&&t.expense>0){const day=Number(today.slice(8)),days=monthDays(ui.month),forecast=Math.round(t.expense/day*days);if(day>=5 && forecast>t.expense*1.3)add('⌁','Dự báo chi tiêu cuối tháng',`Nếu giữ nhịp chi tiêu hiện tại, cuối tháng có thể đạt khoảng ${fullMoney(forecast)}. Đây chỉ là phép ngoại suy theo ngày, không phải dự báo chắc chắn.`,'neutral');}
 const top=categorySpends();if(top.length)add('◉','Khoản chi lớn nhất tháng',`${top[0].cat.name} chiếm ${Math.round(top[0].value/Math.max(1,t.expense)*100)}% tổng chi (${fullMoney(top[0].value)}). Đây là nơi đáng xem xét khi cần tối ưu.`);
 if(t.income>0&&t.expense<=t.income)add('✧','Bạn đang giữ lại được tiền',`Tháng này thu nhập trừ chi tiêu còn ${fullMoney(t.income-t.expense)} (${Math.round((t.income-t.expense)/t.income*100)}% thu nhập).`,'good');
 if(!tips.length)add('✦','Bắt đầu với vài giao dịch',`Ghi khoản thu và chi mỗi ngày. Tamy sẽ phân tích xu hướng, ngân sách và hạn trả thẻ từ dữ liệu đó.`);
 return tips;
}
function renderSmartTeaser(){const insight=smartInsights()[0];return `<button class="smart-teaser" data-action="nav" data-view="smart"><span class="smart-shine">✦</span><span><small>TAMY SMART · GỢI Ý HÔM NAY</small><strong>${escapeHtml(insight.title)}</strong><span>${escapeHtml(insight.body)}</span></span><b aria-hidden="true">↗</b></button>`;}
function renderSmart(){const t=totals(),tips=smartInsights(),cards=(state.creditCards||[]),debt=cards.reduce((n,c)=>n+cardDebt(c.id),0),share=t.income?Math.round((t.income-t.expense)/t.income*100):null;

>Điểm đáng chú ý</h2><span>${tips.length} phân tích</span></div><div class="smart-tips">${tips.map(tip=>`<div class="smart-tip smart-${tip.level}"><div class="smart-tip-icon">${tip.icon}</div><div><h3>${escapeHtml(tip.title)}</h3><p>${escapeHtml(tip.body)}</p></div></div>`).join('')}</div><p class="smart-footnote">Tamy Smart sử dụng công thức và quy tắc cố định trên dữ liệu bạn đã nhập, không đưa ra lời khuyên đầu tư cá nhân hoặc thay thế tư vấn tài chính chuyên nghiệp.</p>`;

function smartReply(question){const q=normalize(question),t=totals(),budget=(state.budgets||[]).filter(b=>b.month===ui.month),cards=state.creditCards||[],due=cards.map(c=>({card:c,...cardDueInfo(c)})).filter(d=>d.due).sort((a,b)=>a.due.localeCompare(b.due)),top=categorySpends();
 if(/the|tindung|saoke|daohan|tra no|thanh toan/.test(q.replace(/ /g,''))||/thẻ|tín dụng/.test(question.toLowerCase()))return due.length?`Thẻ gần kỳ trả nhất: ${due[0].card.name}, hạn ${dateLabel(due[0].due)}, còn khoảng ${fullMoney(due[0].amount)} theo ước tính. Tổng dư nợ thẻ hiện tại ${fullMoney(cards.reduce((n,c)=>n+cardDebt(c.id),0))}. Hãy đối chiếu sao kê ngân hàng.`:`Bạn có ${cards.length} thẻ đang theo dõi. Hiện không có khoản quẹt thẻ nào được xác định là sắp đến hạn; hãy kiểm tra dư nợ đầu kỳ và sao kê ngân hàng.`;
 if(/ngan sach|con bao nhieu|han muc/.test(q)){const allocated=budget.reduce((n,b)=>n+number(b.limit),0),spent=budget.reduce((n,b)=>n+budgetSpent(b),0);return allocated?`Tổng ngân sách tháng ${monthLabel(ui.month)} là ${fullMoney(allocated)}, đã dùng ${fullMoney(spent)}, còn ${fullMoney(allocated-spent)}. ${spent>allocated?'Đang vượt ngân sách.':'Bạn có thể xem chi tiết từng danh mục ở mục Ngân sách.'}`:'Bạn chưa đặt ngân sách cho tháng đang xem. Hãy mở mục Ngân sách để tạo hạn mức.';}
 if(/nhieu nhat|danh muc|vao dau/.test(q))return top.length?`Danh mục chi nhiều nhất là ${top[0].cat.name}: ${fullMoney(top[0].value)}, chiếm ${Math.round(top[0].value/Math.max(t.expense,1)*100)}% tổng chi tháng ${monthLabel(ui.month)}.`:'Chưa có khoản chi nào trong tháng để phân tích danh mục.';
 if(/thu nhap|thu duoc|tien vao/.test(q))return `Tổng thu nhập tháng ${monthLabel(ui.month)} là ${fullMoney(t.income)}. Sau khi trừ chi tiêu ${fullMoney(t.expense)}, bạn giữ lại ${fullMoney(t.income-t.expense)}.`;
 if(/chi|tieu|bao nhieu|dong tien|tinh hinh/.test(q))return `${monthLabel(ui.month)} bạn chi ${fullMoney(t.expense)}, thu ${fullMoney(t.income)}. Chênh lệch thu–chi là ${fullMoney(t.income-t.expense)}. Chi tiêu bằng thẻ được tính vào chi phí ngay khi quẹt; tiền trả thẻ không bị tính trùng.`;
 return `Tamy có thể phân tích chi tiêu, thu nhập, ngân sách, danh mục và lịch trả thẻ. Bạn hãy hỏi ngắn gọn, ví dụ: “Tôi chi nhiều nhất vào đâu?” hoặc chọn một gợi ý phía trên.`;
}

 <section class="card space-top"><div class="section-head"><div><h2>Danh mục tùy chỉnh</h2><p>Thêm danh mục phù hợp cuộc sống của bạn</p></div><button class="btn btn-outline btn-small" data-action="add-category">${icons('plus','icon-sm')} Thêm</button></div><div class="overline" style="margin:13px 0 9px">CHI TIÊU</div><div class="chip-list">${state.categories.filter(c=>c.type==='expense').map(catChip).join('')}</div><div class="overline" style="margin:20px 0 9px">THU NHẬP</div><div class="chip-list">${state.categories.filter(c=>c.type==='income').map(catChip).join('')}</div></section></div>
 <div><section class="card"><div class="section-head"><div><h2>Dữ liệu & sao lưu</h2><p>Sao lưu thường xuyên để giữ lịch sử an toàn</p></div></div><div class="settings-row"><div class="settings-row-content"><span class="settings-icon">${icons('download')}</span><div><strong>Xuất bản sao lưu JSON</strong><p>Lưu toàn bộ ví, giao dịch, ngân sách và danh mục.</p></div></div><button class="btn btn-outline btn-small" data-action="export-json">Xuất</button></div><div class="settings-row"><div class="settings-row-content"><span class="settings-icon">${icons('upload')}</span><div><strong>Khôi phục bản sao lưu</strong><p>Nhập lại tệp JSON đã xuất từ Tamy (thay thế dữ liệu hiện tại).</p></div></div><button class="btn btn-outline btn-small" data-action="import-json">Nhập</button></div><div class="settings-row"><div class="settings-row-content"><span class="settings-icon">${icons('receipt')}</span><div><strong>Xuất danh sách giao dịch CSV</strong><p>Mở bằng Excel hoặc Google Sheets.</p></div></div><button class="btn btn-outline btn-small" data-action="export-csv">Xuất</button></div></section>

function catChip(c){const deletable=!CATEGORIES.some(d=>d.id===c.id) && !(state.transactions.some(t=>t.categoryId===c.id)||(state.creditEntries||[]).some(e=>e.categoryId===c.id))&&!state.budgets.some(b=>b.categoryId===c.id);return `<span class="category-chip"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${c.color}"></span>${escapeHtml(c.name)}${deletable?`<button data-action="delete-category" data-id="${escapeHtml(c.id)}" aria-label="Xóa ${escapeHtml(c.name)}">${icons('close','icon-xs')}</button>`:''}</span>`;}
function openModal(kind,id=null,preset={}){
 let draft={};
 if(kind==='transaction'){
  const existing=id?state.transactions.find(t=>t.id===id):null;
  draft=existing?clone(existing):{type:preset.type||'expense',amount:'',date:localToday(),categoryId:preset.type==='income'?'salary':'food',walletId:state.wallets[0]?.id,fromWalletId:state.wallets[0]?.id,toWalletId:state.wallets[1]?.id||state.wallets[0]?.id,note:''};
 }else if(kind==='credit-card'){
  draft=id?clone((state.creditCards||[]).find(c=>c.id===id)||{}):{name:'',last4:'',limit:'',openingDebt:0,closingDay:20,dueDay:5};
 }else if(kind==='credit-entry'){
  draft=id?clone((state.creditEntries||[]).find(e=>e.id===id)||{}):{cardId:preset.cardId||(state.creditCards||[])[0]?.id,kind:preset.kind||'charge',amount:'',date:localToday(),categoryId:'food',walletId:state.wallets[0]?.id,note:''};
 }else if(kind==='wallet'){
  draft=id?clone(state.wallets.find(w=>w.id===id)||{}):{name:'',opening:'',icon:'wallet',color:COLORS[0]};
 }else if(kind==='budget'){
  draft=id?clone(state.budgets.find(b=>b.id===id)||{}):{categoryId:preset.categoryId||'food',limit:'',month:ui.month};
 }else if(kind==='category'){
  draft={name:'',type:'expense',icon:'gift',color:COLORS[0]};
 }else if(kind==='name'){
  draft={name:state.settings.name||'Bạn'};
 }else if(kind==='confirm'){
  draft=preset;
 }
 ui.modal={kind,id};ui.draft=draft;renderModal();
 const focusId={transaction:'amount-field',wallet:'wallet-name',budget:'budget-amount',category:'category-name',name:'display-name'}[kind];
 if(focusId)window.setTimeout(()=>{const el=document.getElementById(focusId);if(el && window.innerWidth>700)el.focus();},60);
}

 ${picker}${transfer?`<div class="form-row"><div class="form-field"><label for="from-wallet" class="form-label">Từ ví</label><select id="from-wallet" name="fromWalletId" data-field="fromWalletId" class="form-control">${walletOptions(d.fromWalletId)}</select></div><div class="form-field"><label for="to-wallet" class="form-label">Đến ví</label><select id="to-wallet" name="toWalletId" data-field="toWalletId" class="form-control">${walletOptions(d.toWalletId)}</select></div></div>`:`<div class="form-field"><label for="tx-wallet" class="form-label">Ghi nhận vào ví</label><select id="tx-wallet" name="walletId" data-field="walletId" class="form-control">${walletOptions(d.walletId)}</select></div>`}

function renderCategoryModal(){const d=ui.draft;return `${modalHeading('Thêm danh mục','Phân loại các khoản thu chi theo nhu cầu')}<form id="category-form" class="modal-content"><div class="form-field"><label for="category-name" class="form-label">Tên danh mục</label><input class="form-control" id="category-name" name="name" data-field="name" maxlength="30" placeholder="Ví dụ: Du lịch" required value="${escapeHtml(d.name)}"/></div><div class="form-row"><div class="form-field"><label for="category-type" class="form-label">Loại</label><select class="form-control" id="category-type" name="type" data-field="type"><option value="expense">Chi tiêu</option><option value="income">Thu nhập</option></select></div><div class="form-field"><label for="category-icon" class="form-label">Biểu tượng</label><select class="form-control" id="category-icon" name="icon" data-field="icon">${[['gift','Món quà'],['food','Ăn uống'],['shopping','Mua sắm'],['car','Di chuyển'],['house','Nhà cửa'],['heart','Sức khỏe'],['book','Học tập'],['coffee','Cà phê'],['briefcase','Công việc'],['star','Ngôi sao'],['piggy','Tiết kiệm']].map(([v,l])=>`<option value="${v}" ${d.icon===v?'selected':''}>${l}</option>`).join('')}</select></div></div><div class="form-field"><label class="form-label">Chọn màu hiển thị</label>${renderColorPicker(d.color)}</div>${modalFormFooter(false,'Thêm danh mục')}</form>`;}

function renderModal(){const root=document.getElementById('modal-root');if(!root)return;if(!ui.modal){root.innerHTML='';document.body.style.overflow='';return;}let inner='';switch(ui.modal.kind){case'transaction':inner=renderTransactionModal();break;case'wallet':inner=renderWalletModal();break;case'budget':inner=renderBudgetModal();break;case'category':inner=renderCategoryModal();break;case'name':inner=renderNameModal();break;case'confirm':inner=renderConfirmModal();break;case'credit-card':inner=renderCreditCardModal();break;case'credit-entry':inner=renderCreditEntryModal();break;}root.innerHTML=`<div class="modal-overlay" id="modal-overlay"><div class="modal-dialog" role="dialog" aria-modal="true" aria-label="${escapeHtml(ui.modal.kind)}">${inner}</div></div>`;document.body.style.overflow='hidden';}
function showError(msg){const node=document.getElementById('form-error');if(node)node.textContent=msg;else toast(msg,'alert');}
function parseAmount(str){const digits=String(str??'').replace(/[^0-9]/g,'');return digits?Number(digits):0;}
function validAmount(n,allowZero=false){return Number.isSafeInteger(n) && n>=0 && n<=1e12 && (allowZero || n>0);}
function commitTransaction(form){const d=ui.draft,amount=parseAmount(form.elements.amount.value),date=form.elements.date.value,note=String(form.elements.note.value||'').trim().slice(0,120);if(!validAmount(amount))return showError('Vui lòng nhập số tiền hợp lệ, lớn hơn 0.');if(!/^\d{4}-\d{2}-\d{2}$/.test(date) || Number.isNaN(new Date(date+'T12:00:00').getTime()))return showError('Vui lòng chọn ngày hợp lệ.');if(d.type==='transfer'&&state.wallets.length<2)return showError('Cần ít nhất 2 ví để chuyển tiền.');let entry={id:ui.modal.id||uuid(),type:d.type,amount,date,note};if(d.type==='transfer'){
  entry.fromWalletId=form.elements.fromWalletId.value;entry.toWalletId=form.elements.toWalletId.value;
  if(entry.fromWalletId===entry.toWalletId)return showError('Ví nguồn và ví đích phải khác nhau.');
 }else{
  entry.walletId=form.elements.walletId.value;entry.categoryId=d.categoryId;
  if(!state.categories.some(c=>c.id===entry.categoryId&&c.type===d.type))return showError('Vui lòng chọn một danh mục.');
 }
 if(ui.modal.id){const idx=state.transactions.findIndex(t=>t.id===ui.modal.id);if(idx<0)return showError('Không tìm thấy giao dịch.');state.transactions[idx]=entry;}else state.transactions.unshift(entry);
 save();closeModal();renderShell();toast(ui.modal?'Đã lưu thay đổi':'Đã lưu giao dịch thành công');
}
function commitWallet(form){const name=String(form.elements.name.value||'').trim().slice(0,45),opening=parseAmount(form.elements.opening.value),iconName=form.elements.icon.value,color=ui.draft.color;if(!name)return showError('Vui lòng nhập tên ví.');if(!validAmount(opening,true))return showError('Số dư ban đầu phải từ 0 đến 1.000 tỷ đồng.');const obj={id:ui.modal.id||uuid(),name,opening,icon:ICONS[iconName]?iconName:'wallet',color:COLORS.includes(color)?color:COLORS[0]};if(ui.modal.id){const idx=state.wallets.findIndex(w=>w.id===ui.modal.id);if(idx<0)return showError('Không tìm thấy ví.');state.wallets[idx]=obj;}else state.wallets.push(obj);save();closeModal();renderShell();toast('Đã lưu thông tin ví');}
function commitBudget(form){const categoryId=form.elements.categoryId.value,limit=parseAmount(form.elements.limit.value),month=ui.draft.month||ui.month;if(!validAmount(limit))return showError('Nhập giới hạn lớn hơn 0 và không vượt quá 1.000 tỷ.');if(!state.categories.some(c=>c.id===categoryId&&c.type==='expense'))return showError('Danh mục không hợp lệ.');const old=state.budgets.find(b=>b.month===month&&b.categoryId===categoryId),id=ui.modal.id||old?.id||uuid();const obj={id,categoryId,limit,month};if(ui.modal.id){const idx=state.budgets.findIndex(b=>b.id===ui.modal.id);if(idx<0)return showError('Không tìm thấy ngân sách.');if(old&&old.id!==id)return showError('Danh mục này đã có ngân sách.');state.budgets[idx]=obj;}else if(old){Object.assign(old,obj);}else state.budgets.push(obj);save();closeModal();renderShell();toast('Đã lưu ngân sách');}
function commitCategory(form){const name=String(form.elements.name.value||'').trim().slice(0,30),type=form.elements.type.value,iconName=form.elements.icon.value;if(!name)return showError('Hãy nhập tên danh mục.');if(!['income','expense'].includes(type))return showError('Loại danh mục không hợp lệ.');if(state.categories.some(c=>c.type===type&&normalize(c.name)===normalize(name)))return showError('Danh mục này đã tồn tại.');state.categories.push({id:uuid(),name,type,icon:ICONS[iconName]?iconName:'gift',color:COLORS.includes(ui.draft.color)?ui.draft.color:COLORS[0]});save();closeModal();renderShell();toast('Đã thêm danh mục mới');}
function confirm(title,message,action,opts={}){openModal('confirm',null,{title,message,action,...opts});}
function deleteCurrent(){const kind=ui.modal?.kind,id=ui.modal?.id;if(!id)return;
 if(kind==='credit-card'){if((state.creditEntries||[]).some(e=>e.cardId===id)){toast('Thẻ có lịch sử giao dịch, hãy xóa giao dịch trước để giữ dữ liệu chính xác.','alert');return;}confirm('Xóa thẻ tín dụng?','Thẻ chưa có giao dịch sẽ bị xóa.','delete-credit-card',{id,danger:true,accept:'Xóa thẻ'});}
 if(kind==='credit-entry'){const entry=(state.creditEntries||[]).find(e=>e.id===id);if(entry?.kind==='charge'&&cardDebt(entry.cardId)<number(entry.amount)){toast('Khoản quẹt đã được thanh toán một phần. Hãy xóa hoặc sửa khoản trả nợ trước.','alert');return;}confirm('Xóa giao dịch thẻ?','Dư nợ, hạn mức và báo cáo sẽ được cập nhật.','delete-credit-entry',{id,danger:true,accept:'Xóa giao dịch'});}
 if(kind==='transaction')confirm('Xóa giao dịch?','Giao dịch này sẽ bị xóa khỏi tất cả báo cáo và số dư ví.','delete-transaction',{id,danger:true,warning:'Thao tác này không thể hoàn tác.',accept:'Xóa giao dịch'});
 if(kind==='wallet'){
  if(state.wallets.length<=1){toast('Cần giữ lại ít nhất một ví.','alert');return;}
  if(state.transactions.some(t=>t.walletId===id||t.fromWalletId===id||t.toWalletId===id)||(state.creditEntries||[]).some(e=>e.kind==='payment'&&e.walletId===id)){toast('Ví đang có giao dịch. Hãy giữ ví để không mất lịch sử.','alert');return;}
  confirm('Xóa ví này?','Ví chưa phát sinh giao dịch sẽ được xóa khỏi danh sách.','delete-wallet',{id,danger:true,accept:'Xóa ví'});
 }
 if(kind==='budget')confirm('Xóa ngân sách?','Giới hạn của danh mục này sẽ bị gỡ bỏ. Các giao dịch vẫn được giữ nguyên.','delete-budget',{id,danger:true,accept:'Xóa ngân sách'});
}
function applyConfirm(){const d=ui.draft;if(!d)return;switch(d.action){
 case'delete-credit-card':state.creditCards=state.creditCards.filter(c=>c.id!==d.id);break;
 case'delete-credit-entry':state.creditEntries=state.creditEntries.filter(e=>e.id!==d.id);break;
 case'delete-transaction':state.transactions=state.transactions.filter(t=>t.id!==d.id);break;
 case'delete-wallet':state.wallets=state.wallets.filter(w=>w.id!==d.id);break;
 case'delete-budget':state.budgets=state.budgets.filter(b=>b.id!==d.id);break;
 case'delete-category':state.categories=state.categories.filter(c=>c.id!==d.id);break;
 case'clear-data':case'start-fresh':state=createEmpty();break;
 case'reset-demo':state=createDemo();break;
 case'import':if(pendingImport)state=pendingImport;pendingImport=null;break;
 default:return;
 }
 save();closeModal();ui.search='';ui.filter='all';ui.month=thisMonth();renderShell();toast('Đã cập nhật dữ liệu');
}
function downloadFile(name,mime,contents){const blob=new Blob([contents],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();window.setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportJSON(){downloadFile(`tamy-backup-${localToday()}.json`,'application/json;charset=utf-8',JSON.stringify(state,null,2));toast('Đã tạo tệp sao lưu JSON','download');}
function exportCSV(){const rows=[['Ngày','Loại','Số tiền (VND)','Danh mục','Ví','Ví đích','Ghi chú']];for(const t of [...state.transactions].sort((a,b)=>b.date.localeCompare(a.date))){rows.push([t.date,t.type==='expense'?'Chi tiêu':t.type==='income'?'Thu nhập':'Chuyển ví',t.amount,t.type==='transfer'?'Chuyển ví':category(t.categoryId).name,t.type==='transfer'?wallet(t.fromWalletId).name:wallet(t.walletId).name,t.type==='transfer'?wallet(t.toWalletId).name:'',t.note||'']);}for(const e of state.creditEntries||[]){rows.push([e.date,e.kind==='charge'?'Chi tiêu thẻ tín dụng':'Thanh toán dư nợ thẻ',e.amount,e.kind==='charge'?category(e.categoryId).name:'Không tính chi tiêu',e.kind==='payment'?wallet(e.walletId).name:'',cardName(e.cardId),e.note||'']);}const csv='\ufeff'+rows.map(row=>row.map(v=>{let cell=String(v??'');if(/^[\s]*[=+@-]/.test(cell))cell="'"+cell;return '"'+cell.replace(/"/g,'""')+'"';}).join(',')).join('\r\n');downloadFile(`tamy-giao-dich-${localToday()}.csv`,'text/csv;charset=utf-8',csv);toast('Đã xuất danh sách giao dịch','download');}
let pendingImport=null;
function safeImportedState(obj){if(!validateState(obj))throw Error('Tệp không đúng định dạng sao lưu của Tamy.');if(obj.wallets.length>150||obj.categories.length>500||obj.transactions.length>100000||obj.budgets.length>5000)throw Error('Tệp quá lớn hoặc không hợp lệ.');
 const ids=new Set(),categoryIds=new Set();
 const wallets=obj.wallets.map(w=>{if(!w||typeof w.id!=='string'||!w.id||ids.has(w.id)||typeof w.name!=='string'||!Number.isFinite(Number(w.opening)))throw Error('Ví trong tệp không hợp lệ.');ids.add(w.id);return {id:w.id.slice(0,120),name:w.name.slice(0,45),opening:Math.trunc(Number(w.opening)),icon:ICONS[w.icon]?w.icon:'wallet',color:COLORS.includes(w.color)?w.color:COLORS[0]};});
 const cats=obj.categories.map(c=>{if(!c||typeof c.id!=='string'||!c.id||categoryIds.has(c.id)||!['income','expense'].includes(c.type)||typeof c.name!=='string')throw Error('Danh mục trong tệp không hợp lệ.');categoryIds.add(c.id);return {id:c.id.slice(0,120),name:c.name.slice(0,30),type:c.type,icon:ICONS[c.icon]?c.icon:'gift',color:/^#[a-f0-9]{6}$/i.test(c.color)?c.color:'#bdcfc4'};});
 const ts=obj.transactions.map(t=>{if(!t||!['expense','income','transfer'].includes(t.type)||!validAmount(Number(t.amount))||!/^\d{4}-\d{2}-\d{2}$/.test(t.date))throw Error('Giao dịch trong tệp không hợp lệ.');if(t.type==='transfer'&&(!ids.has(t.fromWalletId)||!ids.has(t.toWalletId)||t.fromWalletId===t.toWalletId))throw Error('Ví chuyển tiền không hợp lệ.');if(t.type!=='transfer'&&(!ids.has(t.walletId)||!categoryIds.has(t.categoryId)))throw Error('Giao dịch tham chiếu đến ví hoặc danh mục không tồn tại.');return {id:String(t.id||uuid()).slice(0,120),type:t.type,amount:Math.trunc(Number(t.amount)),date:t.date,note:String(t.note||'').slice(0,120),...(t.type==='transfer'?{fromWalletId:t.fromWalletId,toWalletId:t.toWalletId}:{walletId:t.walletId,categoryId:t.categoryId})};});
 const budgets=obj.budgets.map(b=>{if(!b||!categoryIds.has(b.categoryId)||!validAmount(Number(b.limit))||!/^\d{4}-\d{2}$/.test(b.month))throw Error('Ngân sách trong tệp không hợp lệ.');return {id:String(b.id||uuid()).slice(0,120),categoryId:b.categoryId,month:b.month,limit:Math.trunc(Number(b.limit))};});
 const ccIds=new Set(),creditCards=(Array.isArray(obj.creditCards)?obj.creditCards:[]).map(c=>{if(!c||typeof c.id!=='string'||ccIds.has(c.id)||!c.id||typeof c.name!=='string'||!validAmount(Number(c.limit))||!Number.isFinite(Number(c.openingDebt))||Number(c.openingDebt)<0||!Number.isInteger(Number(c.closingDay))||Number(c.closingDay)<1||Number(c.closingDay)>31||!Number.isInteger(Number(c.dueDay))||Number(c.dueDay)<1||Number(c.dueDay)>31)throw Error('Thẻ tín dụng trong tệp không hợp lệ.');ccIds.add(c.id);return {id:c.id.slice(0,120),name:c.name.slice(0,45),last4:/^\d{4}$/.test(c.last4||'')?c.last4:'',limit:Math.trunc(Number(c.limit)),openingDebt:Math.trunc(Number(c.openingDebt)),closingDay:Number(c.closingDay),dueDay:Number(c.dueDay)};});
 if(creditCards.length>100||!Array.isArray(obj.creditEntries||[])||(obj.creditEntries||[]).length>100000)throw Error('Danh sách thẻ quá lớn hoặc không hợp lệ.');
 const creditEntries=(obj.creditEntries||[]).map(e=>{if(!e||!['charge','payment'].includes(e.kind)||!ccIds.has(e.cardId)||!validAmount(Number(e.amount))||!/\d{4}-\d{2}-\d{2}/.test(e.date))throw Error('Giao dịch thẻ không hợp lệ.');if(e.kind==='payment'&&!ids.has(e.walletId))throw Error('Ví thanh toán thẻ không hợp lệ.');if(e.kind==='charge'&&!categoryIds.has(e.categoryId))throw Error('Danh mục thẻ không hợp lệ.');return {id:String(e.id||uuid()).slice(0,120),kind:e.kind,cardId:e.cardId,amount:Math.trunc(Number(e.amount)),date:e.date,note:String(e.note||'').slice(0,120),...(e.kind==='payment'?{walletId:e.walletId}:{categoryId:e.categoryId})};});
 return {version:1,mode:'personal',settings:{name:String(obj.settings.name||'Bạn').slice(0,35),theme:obj.settings.theme==='dark'?'dark':'light',textSize:['large','extra'].includes(obj.settings.textSize)?obj.settings.textSize:'comfortable'},wallets,categories:cats,transactions:ts,budgets,creditCards,creditEntries};
}

 case'export-csv':exportCSV();return;
 case'import-json':document.getElementById('import-input').click();return;
 case'clear-data':confirm('Xóa toàn bộ dữ liệu?','Mọi giao dịch, ví, ngân sách và danh mục tùy chỉnh sẽ bị xóa. Một sổ thu chi trống sẽ được tạo.','clear-data',{danger:true,warning:'Nên xuất sao lưu JSON trước khi xóa. Không thể hoàn tác.',accept:'Xóa tất cả'});return;
 case'start-fresh':confirm('Bắt đầu sổ thu chi mới?','Dữ liệu minh họa sẽ được thay thế bằng ví trống và danh mục mặc định để bạn ghi chép từ đầu.','start-fresh',{danger:false,accept:'Tạo sổ mới'});return;
 case'reset-demo':confirm('Nạp dữ liệu mẫu?','Việc này sẽ thay thế tất cả dữ liệu đang lưu trên trình duyệt bằng dữ liệu trải nghiệm.','reset-demo',{danger:true,warning:'Những thay đổi hiện tại sẽ mất. Nên sao lưu trước.',accept:'Nạp dữ liệu mẫu'});return;
 case'delete-category':confirm('Xóa danh mục?','Danh mục chưa có dữ liệu liên quan sẽ bị xóa.','delete-category',{id,danger:true,accept:'Xóa danh mục'});return;
 case'close-modal':closeModal();return;
 case'delete-current':deleteCurrent();return;
 case'confirm-apply':applyConfirm();return;
 case'set-transaction-type':ui.draft.type=btn.dataset.type;ui.draft.categoryId=state.categories.find(c=>c.type===ui.draft.type)?.id;renderModal();return;
 case'select-category':ui.draft.categoryId=id;renderModal();return;
 case'choose-color':ui.draft.color=btn.dataset.color;renderModal();return;
 }
}
function showSmartReply(query){ui.smartAnswer=smartReply(query);const el=document.getElementById('smart-answer');if(el)el.textContent=ui.smartAnswer;}
document.addEventListener('click',ev=>{const target=ev.target.closest('[data-action]');if(target){ev.preventDefault();handleAction(target.dataset.action,target);return;}if(ev.target.id==='modal-overlay')closeModal();});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&ui.modal)closeModal();});
document.addEventListener('input',ev=>{const el=ev.target;if(el.id==='tx-search'){ui.search=el.value;const node=document.getElementById('transaction-results');if(node)node.innerHTML=renderTransactionResults();return;}
 if(el.dataset.field&&ui.draft){if(el.dataset.field==='amount'||el.dataset.field==='opening'||el.dataset.field==='limit'){
  const raw=el.value.replace(/[^0-9]/g,'').slice(0,16);const val=Number(raw||0);ui.draft[el.dataset.field]=val;el.value=raw?money(val):'';try{el.setSelectionRange(el.value.length,el.value.length);}catch(_){/* some input types do not support selection */}
 }else ui.draft[el.dataset.field]=el.value;}
});
document.addEventListener('change',ev=>{const el=ev.target;if(el.id==='theme-select'){state.settings.theme=el.value==='dark'?'dark':'light';setTheme(state.settings.theme);save();renderShell();return;}if(el.id==='text-size-select'){state.settings.textSize=['large','extra'].includes(el.value)?el.value:'comfortable';setTextSize(state.settings.textSize);save();renderShell();return;}if(el.dataset.field&&ui.draft){ui.draft[el.dataset.field]=['amount','opening','limit'].includes(el.dataset.field)?parseAmount(el.value):el.value;}});
document.addEventListener('submit',ev=>{const f=ev.target;if(!['transaction-form','wallet-form','budget-form','category-form','name-form','credit-card-form','credit-entry-form','smart-form'].includes(f.id))return;ev.preventDefault();if(f.id==='smart-form'){showSmartReply(f.elements.question.value);return;}if(f.id==='credit-card-form'){commitCreditCard(f);return;}if(f.id==='credit-entry-form'){commitCreditEntry(f);return;}if(f.id==='transaction-form')commitTransaction(f);if(f.id==='wallet-form')commitWallet(f);if(f.id==='budget-form')commitBudget(f);if(f.id==='category-form')commitCategory(f);if(f.id==='name-form'){const name=String(f.elements.name.value||'').trim().slice(0,35);if(!name){showError('Tên không được để trống.');return;}state.settings.name=name;save();closeModal();renderShell();toast('Đã cập nhật tên hiển thị');}});
document.getElementById('import-input').addEventListener('change',async ev=>{const file=ev.target.files?.[0];ev.target.value='';if(!file)return;if(file.size>5*1024*1024){toast('Tệp sao lưu vượt quá 5 MB.','alert');return;}try{pendingImport=safeImportedState(JSON.parse(await file.text()));confirm('Khôi phục dữ liệu?','Toàn bộ dữ liệu đang có trên trình duyệt sẽ được thay thế bằng nội dung tệp sao lưu.','import',{warning:'Hãy sao lưu dữ liệu hiện tại trước khi tiếp tục.',danger:true,accept:'Khôi phục dữ liệu'});}catch(err){toast('Không thể nhập: '+(err.message||'Tệp không hợp lệ.'),'alert');}});
renderShell();
restoreBackupWhenNeeded();
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
 navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
}
})();

</script>
</body>
